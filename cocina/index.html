<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pietra · Cocina</title>
<meta name="theme-color" content="#141311">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Pantalla de cocina: fondo oscuro (menos reflejo, se lee de lejos), letra grande, nada para tocar salvo al empezar. */
  --bg:#141311; --surface:#211F1C; --sunk:#1A1917; --ink:#F3F1EC; --muted:#A8A39A; --line:#3A3732;
  --accent:#E4513D; --ok:#5DBB77; --warn:#E8AE4C; --warn-bg:#3B2E15; --bad:#F06A5B; --bad-bg:#45201B; --new:#4C93F0;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --z:1; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:calc(18px*var(--z))/1.35 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow:hidden}
button,input{font:inherit;color:inherit}
h1,h2{font-family:var(--display);margin:0}
:focus-visible{outline:4px solid var(--new);outline-offset:3px}
.btn{border:2px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:12px;cursor:pointer;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:2px solid var(--line);background:var(--surface);height:calc(64px*var(--z))}
.top h1{font-size:calc(26px*var(--z));font-weight:800}
.top .sp{flex:1}
.clock{font:800 calc(30px*var(--z)) var(--display)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-weight:700;white-space:nowrap}
.pill.count{background:var(--accent);color:#fff;font-size:calc(20px*var(--z))}
.pill.zero{background:var(--sunk);color:var(--muted)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.tools{display:flex;gap:6px}
.tools .btn{min-height:36px;padding:4px 10px;font-size:15px}
.btn.wake{background:var(--warn);border-color:var(--warn);color:#1a1405;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
main{height:calc(100% - 64px*var(--z));overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(300px*var(--z)),1fr));gap:14px;align-content:start}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:12vh 20px;font-size:calc(26px*var(--z))}
.empty strong{display:block;color:var(--ink);font:800 calc(40px*var(--z)) var(--display);margin-bottom:6px}
.card{background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card.warn{border-color:var(--warn)} .card.late{border-color:var(--bad);background:var(--bad-bg)}
.card.new{border-color:var(--new);animation:flash 1s ease-in-out 3}
.c-top{display:flex;align-items:baseline;gap:10px}
.c-top .num{font:800 calc(34px*var(--z)) var(--display)}
.c-top .who{font-weight:600;font-size:calc(22px*var(--z));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.c-top .time{font:800 calc(24px*var(--z)) var(--display);white-space:nowrap}
.card.warn .time{color:var(--warn)} .card.late .time{color:var(--bad)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-weight:800;font-size:calc(15px*var(--z));letter-spacing:.04em;padding:2px 10px;border-radius:8px;background:var(--sunk);color:var(--muted)}
.tag.envio{background:#1E2F45;color:#8EBBF5} .tag.retiro{background:#2B2A1D;color:#E3D58A}
.tag.nuevo{background:var(--new);color:#fff} .tag.mod{background:var(--warn);color:#1a1405}
.items{margin:0;padding:0;list-style:none;font-size:calc(23px*var(--z));line-height:1.3}
.items li{display:flex;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.items li:last-child{border-bottom:0}
.items .q{min-width:calc(42px*var(--z));font-weight:800;color:var(--accent)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:6px 10px;font-weight:700;font-size:calc(20px*var(--z))}
@keyframes flash{50%{box-shadow:0 0 0 6px var(--new)}}
#gone{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:9;pointer-events:none}
#gone div{background:var(--ok);color:#0c1a10;font:800 calc(24px*var(--z)) var(--display);padding:10px 22px;border-radius:14px}
#gone div.x{background:var(--muted);color:#111}
/* Inicio de sesión y arranque */
.center{min-height:100%;display:grid;place-items:center;padding:16px}
.box{width:min(440px,100%);background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px;text-align:center}
.field{display:flex;flex-direction:column;gap:4px;text-align:left}
.field span{font-size:14px;font-weight:600;color:var(--muted)}
.field input{border:2px solid var(--line);background:var(--sunk);border-radius:10px;padding:12px;font-size:18px}
.hint{color:var(--muted);margin:0;font-size:16px}
.big{font-size:22px;min-height:64px}
@media (prefers-reduced-motion:reduce){.card.new{animation:none}}
</style>
</head>
<body>
<div id="login" class="center" hidden></div>
<div id="app" hidden>
  <header class="top"><h1>Cocina</h1><span id="count" class="pill zero"></span><span id="net"></span><span class="sp"></span>
    <div class="tools"><button class="btn" id="zminus" aria-label="Letra más chica">A−</button><button class="btn" id="zplus" aria-label="Letra más grande">A+</button><button class="btn" id="snd">Sonido: sí</button><button class="btn" id="logout">Salir</button></div>
    <span class="clock" id="clock"></span></header>
  <main id="main"></main>
</div>
<div id="gone" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
"use strict";
// Mismo proyecto de Firebase que la caja. Las reglas de Firestore solo le dejan a la cuenta de cocina LEER
// la lista "kitchen" (productos y notas, sin precios). La cocina no modifica nada: "Listo" se marca en la caja.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA7ofd40-fT6KZDB_G-sPvcmKK3nrqpuYo",
  authDomain: "pizzeria-pietra.firebaseapp.com",
  projectId: "pizzeria-pietra",
  storageBucket: "pizzeria-pietra.firebasestorage.app",
  messagingSenderId: "751027640499",
  appId: "1:751027640499:web:c3159d6caeed1da73178c6"
};
const WARN_MIN = 15, LATE_MIN = 25;   // la tarjeta se pone amarilla y roja
const NEW_MS = 2 * 60000, MOD_MS = 5 * 60000; // cuánto dura el cartel NUEVO / MODIFICADO
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const store = {get(k, d) { try { const v = localStorage.getItem("cocina-" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("cocina-" + k, JSON.stringify(v)); } catch (e) {} }};
let FS, AUTH, all = [], list = [], known = null, unsub = null, offline = false, started = false, unlocked = false;
let zoom = store.get("zoom", 1), sound = store.get("sound", true);

firebase.initializeApp(FIREBASE_CONFIG);
AUTH = firebase.auth(); FS = firebase.firestore();
try { FS.settings({ignoreUndefinedProperties: true, merge: true}); } catch (e) {}
FS.enablePersistence({synchronizeTabs: true}).catch(() => {});

function applyZoom() { document.documentElement.style.setProperty("--z", zoom); }
applyZoom();

AUTH.onAuthStateChanged(u => {
  if (unsub) { unsub(); unsub = null; }
  if (!u) { showLogin(); return; }
  $("#login").hidden = true; $("#app").hidden = false; started = true; keepAwake(); updateSnd(); render();
  setTimeout(() => $("#snd").focus(), 50); // con el control de la tele: apretar OK activa el sonido
  // Se escucha toda la lista (es chica: se vacía al cerrar el turno) para saber si un pedido salió o se anuló.
  unsub = FS.collection("kitchen")
    .onSnapshot({includeMetadataChanges: true}, snap => {
      offline = snap.metadata.fromCache;
      all = snap.docs.map(d => Object.assign({id: d.id}, d.data()));
      list = all.filter(k => k.status === "cocinando");
      checkChanges(snap.metadata.fromCache);
      render();
    }, err => {
      $("#main").innerHTML = `<div class="empty"><strong>No se pueden ver los pedidos</strong>${err && err.code === "permission-denied" ? "Esta cuenta no tiene permiso. Revisá las reglas de Firebase." : "Revisá la conexión a internet."}</div>`;
    });
});

// Los navegadores no dejan sonar hasta que alguien toca la pantalla (o aprieta OK en el control).
function unlockAudio() { if (unlocked) return; beep("unlock"); unlocked = true; updateSnd(); }
document.addEventListener("keydown", unlockAudio); document.addEventListener("pointerdown", unlockAudio);
$("#logout").onclick = () => { if (confirm("¿Cerrar la sesión de la cocina?")) AUTH.signOut().then(() => location.reload()); };
$("#zplus").onclick = () => { zoom = Math.min(1.8, Math.round((zoom + 0.1) * 10) / 10); store.set("zoom", zoom); applyZoom(); };
$("#zminus").onclick = () => { zoom = Math.max(0.7, Math.round((zoom - 0.1) * 10) / 10); store.set("zoom", zoom); applyZoom(); };
$("#snd").onclick = () => {
  if (!unlocked) { unlockAudio(); sound = true; store.set("sound", true); updateSnd(); beep("new"); return; }
  sound = !sound; store.set("sound", sound); updateSnd(); if (sound) beep("new");
};
function updateSnd() { const b = $("#snd"); b.textContent = !unlocked && sound ? "Activar sonido" : "Sonido: " + (sound ? "sí" : "no"); b.classList.toggle("wake", !unlocked && sound); }
updateSnd();

function showLogin() {
  $("#app").hidden = true;
  const box = $("#login"); box.hidden = false;
  box.innerHTML = `<form class="box" id="lf"><h1>Cocina · Pietra</h1><p class="hint">Entrá con la cuenta de cocina. Queda guardada en esta pantalla.</p>
    <label class="field"><span>Correo</span><input id="le" type="email" autocomplete="username" required></label>
    <label class="field"><span>Contraseña</span><input id="lp" type="password" autocomplete="current-password" required></label>
    <p class="hint" id="lerr" style="color:var(--bad)" hidden></p><button class="btn primary big" id="lb">Entrar</button></form>`;
  $("#lf").onsubmit = async e => {
    e.preventDefault(); const b = $("#lb"); b.disabled = true; b.textContent = "Entrando…";
    try { await AUTH.signInWithEmailAndPassword($("#le").value.trim(), $("#lp").value); }
    catch (x) { const c = x && x.code; $("#lerr").textContent = c === "auth/network-request-failed" ? "No hay conexión." : c === "auth/too-many-requests" ? "Demasiados intentos. Esperá unos minutos." : "Correo o contraseña incorrectos."; $("#lerr").hidden = false; b.disabled = false; b.textContent = "Entrar"; }
  };
}

// Pedido nuevo → suena y parpadea. Pedido modificado → suena distinto. Pedido que salió (Listo en la caja) → cartel verde.
function checkChanges(fromCache) {
  const now = new Map(all.map(k => [k.id, k]));
  if (known && !fromCache) {
    let isNew = false, isMod = false;
    now.forEach((k, id) => {
      const before = known.get(id);
      if (k.status !== "cocinando") { if (before && before.status === "cocinando") gone(k, k.status === "listo"); return; }
      if (!before || before.status !== "cocinando") isNew = true;
      else if ((k.updatedAt || 0) > (before.updatedAt || 0) && k.modified) isMod = true;
    });
    known.forEach((k, id) => { if (!now.has(id) && k.status === "cocinando") gone(k, false); });
    if (isNew) beep("new"); else if (isMod) beep("mod");
  }
  if (!fromCache || !known) known = now;
}
function gone(k, ready) {
  const d = document.createElement("div"); if (!ready) d.className = "x";
  d.textContent = `#${k.num == null ? "" : k.num} ${k.name || ""} · ${ready ? "salió ✓" : "cancelado"}`;
  $("#gone").appendChild(d); setTimeout(() => d.remove(), 5000);
}

let audio = null;
function beep(kind) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    if (kind === "unlock" || !sound) return;
    const notes = kind === "mod" ? [[660, 0], [520, 0.25]] : [[880, 0], [1100, 0.2], [880, 0.4], [1100, 0.6]];
    notes.forEach(([f, t]) => {
      const o = audio.createOscillator(), g = audio.createGain(); o.type = "square"; o.frequency.value = f; o.connect(g); g.connect(audio.destination);
      const s = audio.currentTime + t;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.25, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.18);
      o.start(s); o.stop(s + 0.2);
    });
  } catch (e) {}
}
// Que la pantalla no se apague sola (si el navegador lo permite).
let lock = null;
async function keepAwake() { try { if ("wakeLock" in navigator && document.visibilityState === "visible") lock = await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && started) keepAwake(); });

function mins(ms) { return Math.max(0, Math.floor((Date.now() - (ms || Date.now())) / 60000)); }
function card(k) {
  const m = mins(k.createdAt);
  const cls = m >= LATE_MIN ? "late" : m >= WARN_MIN ? "warn" : "";
  const isNew = Date.now() - (k.createdAt || 0) < NEW_MS;
  const isMod = k.modified && Date.now() - (k.updatedAt || 0) < MOD_MS;
  const items = (k.items || []).map(it => `<li><span class="q">${esc(it.qty)}×</span><span>${esc(it.name)}</span></li>`).join("");
  return `<article class="card ${cls} ${isNew ? "new" : ""}">
    <div class="c-top"><span class="num">#${esc(k.num)}</span><span class="who">${esc(k.name || "")}</span><span class="time">${m < 1 ? "ahora" : m + " min"}</span></div>
    <div class="tags"><span class="tag ${k.mode === "envio" ? "envio" : "retiro"}">${k.mode === "envio" ? "ENVÍO" : "RETIRO"}</span>${isNew ? `<span class="tag nuevo">NUEVO</span>` : ""}${isMod ? `<span class="tag mod">MODIFICADO</span>` : ""}</div>
    <ul class="items">${items}</ul>
    ${k.note ? `<div class="note">${esc(k.note)}</div>` : ""}
  </article>`;
}
function render() {
  if (!started) return;
  const d = new Date(); $("#clock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
  const items = list.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  $("#count").textContent = items.length === 1 ? "1 pedido" : `${items.length} pedidos`;
  $("#count").className = "pill " + (items.length ? "count" : "zero");
  $("#net").innerHTML = offline || !navigator.onLine ? `<span class="pill bad">Sin conexión</span>` : "";
  $("#main").innerHTML = items.length ? items.map(card).join("") : `<div class="empty"><strong>Sin pedidos</strong>Cuando la caja guarde o cobre un pedido, aparece acá.</div>`;
}
setInterval(render, 20000);
window.addEventListener("online", render); window.addEventListener("offline", render);
// Recarga sola cada 6 horas (si no hay pedidos en pantalla) para que los navegadores de TV no se pongan lentos.
setInterval(() => { if (!list.length) location.reload(); }, 6 * 3600e3);
</script>
</body>
</html>
