function openKitchen() {
  if (S.phone) return;
  const rows = () => {
    const cook = kitchenCooking();
    const done = (S.kitchen || []).filter(k => k.status === "listo" && Date.now() - (k.readyAt || 0) < 30 * 60000).sort((a, b) => (b.readyAt || 0) - (a.readyAt || 0));
    const m = k => Math.max(0, Math.floor((Date.now() - (k.createdAt || Date.now())) / 60000));
    const its = k => (k.items || []).map(it => `${it.qty}× ${esc(it.name)}`).join(" · ");
    return (cook.length ? `<div class="klist">${cook.map(k => `<div class="krow ${m(k) >= 25 ? "late" : m(k) >= 15 ? "warn" : ""}">
        <span class="num">#${k.num ?? ""}</span>
        <div><strong>${esc(k.name || "Sin nombre")}</strong> <span class="pill plain">${k.mode === "envio" ? "Envío" : "Retiro"}</span> <span class="muted">${m(k) < 1 ? "recién" : m(k) + " min"}</span><div class="its">${its(k)}${k.note ? ` · <strong>${esc(k.note)}</strong>` : ""}</div></div>
        <button class="btn ok" data-act="kready" data-id="${k.id}">Listo</button></div>`).join("")}</div>`
      : `<p class="empty">No hay pedidos en preparación.</p>`)
      + (done.length ? `<h3 style="margin:16px 0 8px;font-size:15px">Listos (últimos 30 min)</h3><div class="klist">${done.map(k => `<div class="krow"><span class="num">#${k.num ?? ""}</span><div><strong>${esc(k.name || "Sin nombre")}</strong> <span class="pill ok plain">Listo ${hhmm(k.readyAt)}</span></div><button class="btn sm ghost" data-act="kundo" data-id="${k.id}">Deshacer</button></div>`).join("")}</div>` : "");
  };
  openModal("Cocina", `<p class="hint" style="margin:0 0 10px">Lo que está en la pantalla de la cocina. Tocá <strong>Listo</strong> cuando el pedido sale y desaparece de su pantalla.</p><div id="kitchenrows">${rows()}</div>`, {wide: true,
    onMount: () => { S.kitchenRefresh = () => { const box = document.querySelector("#kitchenrows"); if (box) box.innerHTML = rows(); else S.kitchenRefresh = null; }; }});
}

/* ---------- Animaciones ---------- */
const reduceMotion = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };
// Reproduce una animación CSS sobre un elemento sin bloquear nada (la clase se quita sola al terminar).
function fx(el, cls) {
  if (!el || reduceMotion()) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  el.addEventListener("animationend", function done(e) { if (e.target === el) { el.classList.remove(cls); el.removeEventListener("animationend", done); } });
}
const fxLater = f => requestAnimationFrame(() => requestAnimationFrame(f));
function closingFx(sum) {
  const box = document.createElement("div"); box.className = "closing-fx"; box.setAttribute("aria-hidden", "true");
  box.innerHTML = `<div class="closing-card"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="29"></circle><path d="M19 33 l9 9 l17 -19"></path></svg><strong>Turno cerrado</strong><span>Total cobrado ${fmt(sum.total)}</span></div>`;
  document.body.appendChild(box);
  setTimeout(() => box.classList.add("out"), reduceMotion() ? 900 : 1100);
  setTimeout(() => box.remove(), reduceMotion() ? 1250 : 1450);
}

/* ---------- Ventas y cobro ---------- */
function addToCart(id) {
  const m = S.menu.find(x => x.id === id); if (!m) return;
  const l = S.cart.find(x => x.id === id);
  if (l) l.qty++; else S.cart.push({id: m.id, name: m.name, price: Number(m.price) || 0, qty: 1});
  render();
  const btn = document.querySelector(`.prod[data-id="${CSS.escape(id)}"]`);
  fx(btn, "fx-bump"); fx(btn && btn.querySelector(".q"), "fx-qty");
  const line = document.querySelector(`.lines .line[data-id="${CSS.escape(id)}"]`);
  if (line) {
    if (l) fx(line.querySelector(".stepper span"), "fx-qty");
    else { fx(line, "fx-line-in"); line.scrollIntoView({block: "nearest", behavior: reduceMotion() ? "auto" : "smooth"}); }
  }
}

function newSale(status, payment, received) {
  const sh = currentShift();
  const total = cartTotal();
  const paid = status === "paid";
  return {
    shiftId: sh.id, num: nextNum(sh), createdAt: Date.now(),
    items: cartItems(), total,
    status, payment: paid ? payment : null, paidAt: paid ? Date.now() : null,
    received: paid && payment === "efectivo" ? received : null,
    change: paid && payment === "efectivo" ? Math.max(0, (received ?? total) - total) : null,
    ...orderFields(), cancelled: false
  };
}
const cartItems = () => S.cart.map(l => ({id: l.id, name: l.name, price: l.price, qty: l.qty}));
const cartFields = () => ({items: cartItems(), total: cartTotal(), ...orderFields(), editedAt: Date.now()});
function resetCart() { S.cart = []; S.note = ""; S.far = false; S.farManual = false; S.editId = null; S.mode = "retiro"; S.addr = ""; S.onote = ""; }
const isFar = () => S.mode === "envio" && S.far;
const orderFields = () => ({note: S.note.trim(), mode: S.mode, address: S.mode === "envio" ? S.addr.trim() : "", orderNote: S.onote.trim(), far: isFar(), farFee: isFar() ? farFee() : 0});
// Tipo de pedido, dirección y nota, para mostrar en listas y detalles.
// Texto corto de la ubicación para listas y tickets (los enlaces largos no se muestran enteros).
function addressShort(raw) {
  const L = Ubicacion.parse(raw, "");
  if (L.kind === "coords") return L.text ? `${L.text} (ubicación exacta)` : `Ubicación exacta ${L.lat}, ${L.lng}`;
  if (L.kind === "short" || L.kind === "link") return L.text ? `${L.text} (enlace de ubicación)` : "Enlace de ubicación";
  return L.text || String(raw);
}
function orderMeta(s, opts = {}) {
  const parts = [];
  if (s.mode === "envio") parts.push(`<span class="pill envio plain">Envío</span>${s.address ? ` <span class="muted">${esc(addressShort(s.address))}</span>` : ""}`);
  else if (s.mode === "retiro") parts.push(`<span class="pill off plain">Retiro</span>`);
  if (s.orderNote) parts.push(`<span class="onote">Nota: ${esc(s.orderNote)}</span>`);
  return parts.length ? (opts.inline ? " " : "<br>") + parts.join(" ") : "";
}

// Guardar ticket nuevo, o guardar los cambios del ticket que se está editando.
async function holdTicket(btn) {
  if (S.busy || !currentShift() || !S.cart.length) return;
  S.busy = true; if (btn) btn.disabled = true;
  const ed = editingSale();
  let ok, msg;
  if (ed) {
    msg = `Ticket #${ed.num} actualizado · ${fmt(cartTotal())}`;
    ok = queue("update", "sales/" + ed.id, cartFields(), `Ticket #${ed.num} editado`);
    syncDelivery({...ed, ...cartFields()}); syncKitchen({...ed, ...cartFields()});
  } else {
    const sale = newSale("pending"), id = newId("sales");
    msg = `Ticket #${sale.num}${sale.note ? " de " + sale.note : ""} guardado · ${fmt(sale.total)} por cobrar`;
    ok = queue("set", "sales/" + id, sale, `Ticket #${sale.num} guardado (${fmt(sale.total)})`);
    if (ok) sendToKitchen({...sale, id});
    if (ok) printCopy({...sale, id}, "pending"); // 1.ª copia: Pedido pendiente (solo al guardarlo, no al editarlo)
  }
  S.busy = false;
  if (!ok) { if (btn) btn.disabled = false; return; }
  resetCart(); render(); toast(msg + (!ed && !S.printer && !S.phone ? " · sin impresora conectada" : ""));
}

// Reabrir un ticket guardado en el panel del pedido para editarlo.
function openTicket(id) {
  const s = S.sales.find(x => x.id === id);
  if (!isPending(s || {})) return;
  if (S.editId === id) { closeModalSilently(); goSell(); return; }
  if (S.cart.length) { toast(S.editId ? "Guardá o salí del ticket que estás editando antes de abrir otro." : "Guardá o vaciá el pedido en pantalla antes de abrir un ticket guardado.", "bad"); return; }
  S.editId = id;
  S.cart = (s.items || []).map(it => ({...it}));
  S.note = s.note || ""; S.far = !!s.far; S.farManual = false;
  S.mode = s.mode === "envio" ? "envio" : (s.far ? "envio" : "retiro"); S.addr = s.address || ""; S.onote = s.orderNote || "";
  closeModalSilently(); goSell();
  setTimeout(() => { const n = $("#note"); if (n) n.focus(); }, 0);
}
function goSell() { S.view = "vender"; try { history.replaceState(null, "", "#vender"); } catch (e) {} render(); }
function closeModalSilently() { const r = $("#modal"); r.hidden = true; r.innerHTML = ""; }

function openDeleteTicket(id) {
  const s = S.sales.find(x => x.id === id); if (!isPending(s || {})) return;
  openModal(`Eliminar ticket #${s.num}`, `<p style="margin:0"><strong>${esc(s.note || "Sin nombre")}</strong><br>${itemsText(s.items)}</p>
    <div class="paybig"><span>Sin cobrar · ${hhmm(s.createdAt)}</span><strong>${fmt(s.total)}</strong></div>

// Lista de tickets guardados, con orden por nombre, fecha o monto.
function savedSorted() {
  const list = pendingTickets().slice();
  const k = S.pendSort;
  if (k === "nombre") list.sort((a, b) => (a.note ? 0 : 1) - (b.note ? 0 : 1) || (a.note || "").localeCompare(b.note || "", "es") || a.createdAt - b.createdAt);
  else if (k === "monto") list.sort((a, b) => b.total - a.total || a.createdAt - b.createdAt);
  else list.sort((a, b) => a.createdAt - b.createdAt);
  return list;
}
function openSaved() {
  if (!currentShift()) return;
  const rows = () => {
    const list = savedSorted();
    if (!list.length) return `<p class="empty">No hay tickets guardados. Usá “Guardar ticket” para dejar un pedido para cobrar después.</p>`;
    const total = list.reduce((t, s) => t + s.total, 0);
    const late = list.filter(isStale);
    return `${late.length ? `<div class="late-alert" role="status"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"></circle><path d="M8 4.6V8l2.4 1.6"></path></svg><span><strong>${plural(late.length, "ticket lleva", "tickets llevan")} más de ${STALE_MIN} minutos sin cobrar.</strong> ${late.length === 1 ? "Está marcado" : "Están marcados"} en rojo.</span></div>` : ""}

        const detail = [itemsText(s.items), s.orderNote ? "Nota: " + esc(s.orderNote) : "", s.mode === "envio" && s.address ? "📍 " + esc(addressShort(s.address)) : ""].filter(Boolean).join(" · ");
        // En la PC, tocar el ticket (fuera de los botones) lo abre para editarlo.
        return `<div class="srow compact ${isStale(s) ? "late" : ""} ${S.phone ? "" : "openable"}" data-sid="${s.id}" ${S.phone ? "" : `data-act="open-ticket" data-id="${s.id}" role="button" tabindex="0" title="Abrir el ticket para editarlo"`}>
        <span class="num">#${s.num}</span>
        <div class="main">
          <div class="l1"><span class="who">${s.note ? esc(s.note) : `<span class="muted">Sin nombre</span>`}</span>
            <span class="age ${isStale(s) ? "late" : ""}" title="Creado ${hhmm(s.createdAt)}">${ageText(s)}${isStale(s) ? " sin cobrar" : ""}</span>
            ${s.mode === "envio" ? `<span class="pill envio plain">Envío</span>` : `<span class="pill off plain">Retiro</span>`}${s.far ? `<span class="pill warn plain">+${s.farFee || farFee()}</span>` : ""}${S.editId === s.id ? `<span class="pill warn plain">Editando</span>` : ""}${kitchenBadge(s)}${deliveryBadge(s)}</div>
          <div class="l2" title="${detail.replace(/<[^>]*>/g, "")}">${detail}</div>
        </div>
        <span class="amt">${fmt(s.total)}</span>
        <div class="btns">${kitchenButtons(s)}${deliveryButtons(s, true)}<button class="btn sm ghost" data-act="print-saved" data-id="${s.id}" title="Imprime el pedido como está ahora">Imprimir</button><button class="btn sm primary" data-act="charge" data-id="${s.id}">Cobrar</button></div>
      </div>`; }).join("")}</div>`;
  };
  openModal("Guardados", `<div class="seg" role="radiogroup" aria-label="Ordenar por">
      <label><input type="radio" name="ps" value="nombre" ${S.pendSort === "nombre" ? "checked" : ""}>Nombre</label>
      <label><input type="radio" name="ps" value="fecha" ${S.pendSort === "fecha" ? "checked" : ""}>Más antiguos</label>
      <label><input type="radio" name="ps" value="monto" ${S.pendSort === "monto" ? "checked" : ""}>Monto</label>
    </div><div id="savedrows" class="form">${rows()}</div>`,
    {wide: true, xwide: true, onMount: d => {
      d.querySelectorAll("input[name=ps]").forEach(r => r.addEventListener("change", () => { S.pendSort = r.value; d.querySelector("#savedrows").innerHTML = rows(); }));
      d.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("openable")) { e.preventDefault(); openTicket(e.target.dataset.id); } });
      // Mientras la lista está abierta, el tiempo y las alertas se actualizan solos.

// Cobrar el pedido en pantalla (nuevo o editado), o un ticket guardado sin abrirlo.
function openCharge(saleId) {
  if (saleId && saleId === S.editId) saleId = null;
  const s = saleId ? S.sales.find(x => x.id === saleId) : null;
  if (saleId && !isPending(s || {})) return;
  if (!saleId && (!currentShift() || !S.cart.length)) return;
  const ed = saleId ? null : editingSale();
  const total = s ? s.total : cartTotal();
  const quick = [...new Set([Math.ceil(total / 100) * 100, Math.ceil(total / 500) * 500, Math.ceil(total / 1000) * 1000, Math.ceil(total / 2000) * 2000])].filter(v => v > total).slice(0, 4);
  const who = s ? s.note : S.note.trim();
  openModal(s || ed ? `Cobrar ticket #${(s || ed).num}` : "Cobrar", `
    ${s ? `<p style="margin:0">${itemsText(s.items)}</p>` : ""}${who ? `<p style="margin:0"><strong>${esc(who)}</strong></p>` : ""}
    ${(() => { const m = orderMeta(s || orderFields(), {inline: true}); return m ? `<p style="margin:0">${m}</p>` : ""; })()}
    <div class="paybig"><span>Total a cobrar</span><strong>${fmt(total)}</strong></div>
    <div class="seg two-opt" role="radiogroup" aria-label="Forma de pago">
      <label><input type="radio" name="pm" value="efectivo" checked>Efectivo</label>
      <label><input type="radio" name="pm" value="pos">POS</label>
    </div>
    <div id="cashbox" class="form">
      <label class="field"><span>El cliente entrega ($)</span><input id="recv" class="bigin" type="number" min="0" step="1" inputmode="numeric" placeholder="${Math.round(total)}" autofocus></label>
      <div class="quick"><button type="button" class="btn sm" data-v="${total}">Justo</button>${quick.map(v => `<button type="button" class="btn sm" data-v="${v}">${fmt(v)}</button>`).join("")}</div>
      <div class="paybig change" id="chg"><span>Vuelto</span><strong>${fmt(0)}</strong></div>
    </div>
    <p class="hint" id="poshint" hidden>Cobrá en el POS y confirmá cuando la operación esté aprobada.</p>
    ${s || ed ? `<label class="field tipfield"><span>Propina del delivery con tarjeta ($) · opcional</span>
      <input id="tipcard" type="number" min="0" step="1" inputmode="numeric" placeholder="0" value="${Number((s || ed).tipCard) > 0 ? Math.round(Number((s || ed).tipCard)) : ""}">
      <small class="muted">Es para el cadete: no cambia el total de la venta ni el efectivo o POS.</small></label>` : ""}
    <p class="hint shortcuts" style="margin:0"><span><kbd>E</kbd> efectivo</span><span><kbd>P</kbd> POS</span><span><kbd>Enter</kbd> confirmar</span></p>
    <div class="actions end"><button class="btn ghost" data-act="close-modal">Volver</button><button class="btn primary lg" id="payok">Confirmar cobro</button></div>`,
    {onMount: d => {
      const inp = d.querySelector("#recv"), chg = d.querySelector("#chg"), ok = d.querySelector("#payok");
      const method = () => d.querySelector("input[name=pm]:checked").value;
      const upd = () => {
        const cash = method() === "efectivo";
        d.querySelector("#cashbox").hidden = !cash; d.querySelector("#poshint").hidden = cash;
        if (!cash) { ok.disabled = false; return; }
        const v = inp.value === "" ? total : Number(inp.value);
        const diff = v - total;
        chg.className = "paybig " + (diff < 0 ? "short" : "change");
        chg.innerHTML = diff < 0 ? `<span>Falta</span><strong>${fmt(-diff)}</strong>` : `<span>Vuelto</span><strong>${fmt(diff)}</strong>`;
        ok.disabled = diff < 0;
      };
      const setM = v => { d.querySelector(`input[name=pm][value=${v}]`).checked = true; upd(); if (v === "efectivo") inp.focus(); else ok.focus(); };
      d.querySelectorAll("input[name=pm]").forEach(r => r.addEventListener("change", () => setM(r.value)));
      d.addEventListener("keydown", e => {
        if (e.target === inp) { if (e.key === "Enter" && !ok.disabled) { e.preventDefault(); ok.click(); } if (e.key.toLowerCase() === "p") { e.preventDefault(); setM("pos"); } return; }
        if (e.target.id === "tipcard") { if (e.key === "Enter" && !ok.disabled) { e.preventDefault(); ok.click(); } return; }
        if (e.key.toLowerCase() === "e") { e.preventDefault(); setM("efectivo"); }
        else if (e.key.toLowerCase() === "p") { e.preventDefault(); setM("pos"); }
        else if (e.key === "Enter" && e.target.tagName !== "BUTTON" && !ok.disabled) { e.preventDefault(); ok.click(); }
      });
      inp.addEventListener("input", upd);
      d.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { inp.value = Math.round(Number(b.dataset.v)); upd(); ok.focus(); });
      ok.onclick = () => {
        const m = method();
        const recv = m === "efectivo" ? (inp.value === "" ? total : Number(inp.value)) : null;
        const tf = d.querySelector("#tipcard"), tip = tf ? Math.max(0, Math.round(Number(tf.value) || 0)) : null;
        s ? chargeTicket(s, m, recv, ok, tip) : chargeCart(m, recv, ok, tip);
      };
      upd();
      const dl = deliveryOf((s || ed || {}).id);
      if (dl && dl.collected) { setM(dl.collected === "pos" ? "pos" : "efectivo"); const n = document.createElement("p"); n.className = "hint"; n.style.margin = "0"; n.innerHTML = `<strong>El cadete cobró ${dl.collected === "pos" ? "con POS" : "en efectivo"}</strong> al entregar.`; d.querySelector(".seg.two-opt").after(n); }
    }});
}

async function chargeCart(payment, received, btn, tip = null) {
  if (S.busy) return; S.busy = true; btn.disabled = true;
  const ed = editingSale();
  let ok, num, total = cartTotal(), change = payment === "efectivo" ? Math.max(0, (received ?? total) - total) : null;
  // Se toma el pedido ANTES de guardar: al guardarlo la pantalla se refresca y el panel se vacía.
  const fields = cartFields(), paidAt = Date.now();
  if (ed) {
    num = ed.num;
    // tipCard se guarda como valor del pedido (se reemplaza, no se suma): no se cuenta dos veces.
    ok = queue("update", "sales/" + ed.id, {...fields, status: "paid", payment, paidAt, received: payment === "efectivo" ? received : null, change, tipCard: tip || 0}, `Ticket #${ed.num} cobrado (${PAY[payment]} ${fmt(total)})`);
  } else {
    const sale = newSale("paid", payment, received), id = newId("sales"); num = sale.num; S._lastSale = {...sale, id};
    ok = queue("set", "sales/" + id, sale, `Venta #${sale.num} cobrada (${PAY[payment]} ${fmt(total)})`);
  }
  S.busy = false;
  if (!ok) { btn.disabled = false; return; }
  const printed = ed ? {...ed, ...fields, status: "paid", payment, paidAt, received, change, tipCard: tip || 0} : null;
  if (printed) { syncDelivery(printed, false, true); syncKitchen(printed); } else sendToKitchen(S._lastSale); // venta directa: también va a cocina
  resetCart();
  closeModal();
  moneyBurst(total, payment, change);
  // Ticket guardado que se cobra: 2.ª copia, Comprobante de pago. Venta directa: según "imprimir al cobrar".
  if (printed) printCopy(printed, "paid"); else autoPrint(S._lastSale);
  toast(`${ed ? "Ticket" : "Venta"} #${num} cobrado · ${fmt(total)} ${PAY[payment]}` + (change ? ` · vuelto ${fmt(change)}` : "") + (ed && tip ? ` · propina ${fmt(tip)} para el cadete` : ""));
}

async function chargeTicket(s, payment, received, btn, tip = null) {
  if (S.busy) return; S.busy = true; btn.disabled = true;
  const change = payment === "efectivo" ? Math.max(0, received - s.total) : null;
  const ok = queue("update", "sales/" + s.id, {status: "paid", payment, paidAt: Date.now(), received: payment === "efectivo" ? received : null, change, tipCard: tip || 0}, `Ticket #${s.num} cobrado (${PAY[payment]} ${fmt(s.total)})`);
  S.busy = false;
  if (!ok) { btn.disabled = false; return; }
  closeModal();
  moneyBurst(s.total, payment, change);
  printCopy({...s, status: "paid", payment, paidAt: Date.now(), received, change, tipCard: tip || 0}, "paid"); // 2.ª copia: Comprobante de pago
  syncDelivery({...s, status: "paid", payment}, false, true);
  toast(`Ticket #${s.num} cobrado · ${fmt(s.total)} ${PAY[payment]}` + (change ? ` · vuelto ${fmt(change)}` : "") + (tip ? ` · propina ${fmt(tip)} para el cadete` : ""));
}

// Billetes y monedas que salen disparados desde el centro de la pantalla.
function moneyBurst(amount, payment, change) {
  const layer = document.createElement("div"); layer.className = "burst"; layer.setAttribute("aria-hidden", "true");
  layer.innerHTML = `<div class="burst-label"><span>Cobrado ${PAY[payment] ? "· " + PAY[payment] : ""}</span><strong>${fmt(amount)}</strong>${change ? `<span>Vuelto ${fmt(change)}</span>` : ""}</div>`;
  document.body.appendChild(layer);
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const label = layer.querySelector(".burst-label");
  if (!label.animate) { setTimeout(() => layer.remove(), 1400); return; }
  if (!reduce) {
    const far = Math.max(innerWidth, innerHeight) * 0.62;
    for (let i = 0; i < 34; i++) {
      const el = document.createElement("div");
      const coin = i % 3 === 2;
      el.className = coin ? "coin" : "bill";
      if (!coin) el.textContent = "$";
      layer.insertBefore(el, label);
      const ang = (i / 34) * Math.PI * 2 + (Math.random() - .5) * .5;
      const dist = far * (0.55 + Math.random() * 0.5);
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist + 60;
      const rot = (Math.random() - .5) * 900;
      el.animate([
        {transform: "translate(0,0) scale(.2) rotate(0deg)", opacity: 0},
        {transform: `translate(${dx * .25}px,${dy * .25 - 40}px) scale(1) rotate(${rot * .3}deg)`, opacity: 1, offset: .2},
        {transform: `translate(${dx}px,${dy}px) scale(.9) rotate(${rot}deg)`, opacity: 0}
      ], {duration: 1200 + Math.random() * 600, delay: Math.random() * 150, easing: "cubic-bezier(.2,.7,.3,1)", fill: "forwards"});
    }
  }
  label.animate([
    {transform: "translate(-50%,-50%) scale(.5)", opacity: 0},
    {transform: "translate(-50%,-50%) scale(1.08)", opacity: 1, offset: .18},
    {transform: "translate(-50%,-50%) scale(1)", opacity: 1, offset: .3},
    {transform: "translate(-50%,-50%) scale(1)", opacity: 1, offset: .8},
    {transform: "translate(-50%,-50%) scale(.96)", opacity: 0}
  ], {duration: reduce ? 1400 : 1700, easing: "ease-out", fill: "forwards"});
  setTimeout(() => layer.remove(), 2000);
}

async function applyStock(use, sign) {
  // Solo para ventas viejas que descontaron stock con la receta (ya no se usa).
  for (const [invId, q] of Object.entries(use || {})) {
    const i = S.inv.find(x => x.id === invId); if (!i) continue;
    queue("update", "inventory/" + invId, {stock: round3((Number(i.stock) || 0) + sign * q)}, `Stock de ${i.name}`);
  }
}

    <label class="field"><span>Efectivo contado en caja ($), opcional</span><input id="counted" type="number" min="0" step="1" inputmode="numeric" placeholder="${Math.round(sum.expectedCash)}"></label>

        diff.querySelector("strong").textContent = (v > 0 ? "+ " : v < 0 ? "− " : "") + fmt(Math.abs(v));
        diff.querySelector("span").textContent = Math.round(v) === 0 ? "Caja exacta" : v < 0 ? "Falta en caja" : "Sobra en caja";

async function doCloseShift(sh, sales, sum, counted, btn) {
  if (S.busy || sales.some(isPending)) return; S.busy = true; btn.disabled = true; btn.textContent = "Cerrando…";
  saveNotesNow();
  const notes = (S.notesDraftId === sh.id && S.notesDraft != null ? S.notesDraft : (sh.notes || "")).trim();
  const clean = sales.map(s => ({...s}));
  const closedAt = Date.now();
  let ok = await save(() => S.db.doc("shiftSales/" + sh.id).set({shiftId: sh.id, sales: clean}));
  // Las notas del turno se borran al cerrar; solo quedan impresas en el ticket de cierre.
  if (ok) ok = await save(() => S.db.doc("shifts/" + sh.id).update({status: "closed", closedAt, summary: sum, countedCash: counted, notes: ""}));
  S.busy = false;
  if (!ok) { btn.disabled = false; btn.textContent = "Cerrar turno"; return; }
  S.histCache[sh.id] = clean; resetCart();
  S.notesDraft = null; S.notesDraftId = null;
  OB.recent = []; recompute();
  const closedShift = {...sh, status: "closed", closedAt, summary: sum, countedCash: counted, notes: ""};
  if (S.printer) printClosing(closedShift, clean, notes).then(ok => { if (ok) toast("Ticket de cierre impreso"); });
  for (const s of sales) { try { await S.db.doc("sales/" + s.id).delete(); } catch (e) {} }
  for (const dl of (S.deliveries || []).filter(x => x.shiftId === sh.id)) { try { await S.db.doc("deliveries/" + dl.id).delete(); } catch (e) {} }
  for (const k of (S.kitchen || []).filter(x => x.shiftId === sh.id)) { try { await S.db.doc("kitchen/" + k.id).delete(); } catch (e) {} } // la pantalla de cocina arranca vacía el próximo turno
  closingFx(sum);
  setTimeout(() => showShiftDetail(closedShift, notes), reduceMotion() ? 0 : 750);
}

function showShiftDetail(sh, notesAtClose = "") {
  const sum = sh.summary || summarize([], 0);
  const counted = sh.countedCash;
  const diff = counted == null ? null : counted - sum.expectedCash;
  const sales = S.histCache[sh.id];
  if (!sales) loadShiftSales(sh.id);
  openModal(`Cierre del ${shortDate(sh.openedAt)}`, `<p class="hint" style="margin:0">${longDate(dayKey(sh.openedAt))} · de ${hhmm(sh.openedAt)} a ${sh.closedAt ? hhmm(sh.closedAt) : "?"}</p>
    ${tilesHtml(sum, true)}
    ${cadeteBreakdownHtml(sum, sh)}
    ${counted != null ? `<div class="paybig ${Math.round(diff) < 0 ? "short" : "change"}"><span>Contado en caja ${fmt(counted)} · ${Math.round(diff) === 0 ? "caja exacta" : diff < 0 ? "faltó" : "sobró"}</span><strong>${Math.round(diff) === 0 ? fmt(0) : (diff < 0 ? "− " : "+ ") + fmt(Math.abs(diff))}</strong></div>` : ""}
    <div class="card"><header><h3>Productos vendidos</h3></header>${productsTable(sum.products || [])}</div>
    <div class="card"><header><h3>Todas las ventas</h3></header><div id="shift-detail-sales" data-id="${sh.id}">${sales ? salesTable(sales) : `<p class="empty">Cargando ventas…</p>`}</div></div>
    ${S.phone ? "" : `<p class="hint" style="margin:0">${S.printer ? "Podés imprimir el ticket de cierre cuantas veces quieras." : "Para imprimir el ticket de cierre, conectá la impresora (arriba, en el estado de la impresora)."}</p>`}
    <div class="actions end">${S.phone ? "" : `<button class="btn" id="print-closing" ${S.printer ? "" : "disabled"}>Imprimir cierre</button>`}<button class="btn dark" data-act="close-modal">Listo</button></div>`,
    {wide: true, onMount: d => { const b = d.querySelector("#print-closing"); if (b) b.onclick = async () => {
      b.disabled = true; b.textContent = "Imprimiendo…";
      const list = S.histCache[sh.id]; if (!list) await loadShiftSales(sh.id);

      b.disabled = false; b.textContent = "Imprimir cierre"; if (ok) toast("Ticket de cierre impreso");
    }; }});
}

// Notas del turno: se guardan solas mientras escribís (también sin conexión) y se vacían al cerrar el turno.
let notesTimer = null;
const notesSavedHtml = () => `<span class="tick"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"></path></svg>Guardado</span>`;
function onNotesInput(v) {
  const sh = currentShift(); if (!sh) return;
  S.notesDraft = v; S.notesDraftId = sh.id;
  const st = $("#notes-state"); if (st) st.textContent = "Guardando…";
  clearTimeout(notesTimer);

function saveNotesNow() {
  clearTimeout(notesTimer); notesTimer = null;
  const sh = currentShift();
  if (!sh || S.notesDraftId !== sh.id || S.notesDraft == null) return;
  if ((sh.notes || "") !== S.notesDraft) queue("update", "shifts/" + sh.id, {notes: S.notesDraft}, "Notas del turno");
  S.notesSavedAt = Date.now();
  const st = $("#notes-state"); if (st) { st.innerHTML = notesSavedHtml(); fx(st.querySelector(".tick"), "fx-tick"); }
  clearTimeout(S.notesLabelTimer);
  S.notesLabelTimer = setTimeout(() => { const el = $("#notes-state"); if (el && Date.now() - S.notesSavedAt >= 4900) el.textContent = "Se guardan solas · se borran al cerrar el turno"; }, 5000);
}
/* ---------- Soltar una ubicación (arrastrada desde WhatsApp) ----------
   En Vender: se carga en el pedido que se está armando o editando y se marca Envío.
   Con Guardados abierto: se suelta sobre un ticket y se le carga a ese pedido (y a la ficha del cadete si ya estaba asignado). */
let dragDepth = 0;
const dragHasText = e => { const t = e.dataTransfer && [...(e.dataTransfer.types || [])]; return !!t && !t.includes("Files") && (t.includes("text/uri-list") || t.includes("text/plain")); };
function droppedText(dt) {
  const uri = (dt.getData("text/uri-list") || "").split(/\r?\n/).map(x => x.trim()).find(x => x && !x.startsWith("#"));
  return (uri || dt.getData("text/plain") || dt.getData("URL") || "").trim();
}
const savedOpen = () => !!(S.savedRefresh && !$("#modal").hidden && document.querySelector("#savedrows"));
function dropTarget(e) { return savedOpen() ? (e.target.closest && e.target.closest(".srow[data-sid]")) : null; }
function showDropzone(on, e) {
  const z = $("#dropzone"); z.hidden = !on;
  document.querySelectorAll(".srow.dropover").forEach(r => r.classList.remove("dropover"));
  if (!on) return;
  const rows = savedOpen();
  z.classList.toggle("onrows", rows);
  const row = rows && e ? dropTarget(e) : null;
  if (row) row.classList.add("dropover");
  $("#droptext").textContent = rows ? (row ? "Se carga en este ticket" : "Soltala sobre un ticket de la lista")
    : S.view !== "vender" || S.phone ? "Andá a Vender para cargarla en un pedido" : "Se carga en el pedido y se marca Envío";
}
function applyDroppedLocation(text, e) {
  if (!text) return;
  if (S.phone) { toast("Las ubicaciones se cargan desde la caja (PC).", "bad"); return; }
  if (S.status !== "ready" && S.status !== "slow") return;
  if (savedOpen()) {
    const row = dropTarget(e);
    if (!row) { toast("Soltá la ubicación sobre un ticket de la lista.", "bad"); return; }
    const s = S.sales.find(x => x.id === row.dataset.sid); if (!s || !isPending(s)) return;
    const had = s.mode === "envio" && String(s.address || "").trim() && s.address.trim() !== text;
    const zr = zoneCheck(text), farUpd = zr === null ? {} : {far: !zr, farFee: !zr ? farFee() : 0};
    queue("update", "sales/" + s.id, {mode: "envio", address: text, ...farUpd}, `Ubicación del ticket #${s.num}`);
    syncDelivery({...s, mode: "envio", address: text, ...farUpd}); syncKitchen({...s, mode: "envio", address: text});
    if (S.editId === s.id) { S.mode = "envio"; S.addr = text; if (zr !== null) { S.far = !zr; S.farManual = false; } }
    if (S.savedRefresh) S.savedRefresh();
    toast(`${had ? "Ubicación reemplazada" : "Ubicación cargada"} en el ticket #${s.num}${s.note ? " de " + s.note : ""}${zr === false ? " · fuera de la zona: envío lejano" : zr === true ? " · dentro de la zona" : ""}`);
    return;
  }
  if (!$("#modal").hidden) { toast("Cerrá la ventana abierta y volvé a soltar la ubicación.", "bad"); return; }
  if (S.view !== "vender") { toast("Andá a Vender para cargar la ubicación en un pedido.", "bad"); return; }
  if (!currentShift()) { toast("Abrí el turno para cargar pedidos.", "bad"); return; }
  const had = S.mode === "envio" && S.addr.trim() && S.addr.trim() !== text;
  S.mode = "envio"; S.addr = text; autoFar(); render();
  const info = $("#addr-info"); if (info) fx(info, "fx-bump");
  toast((had ? "Ubicación reemplazada" : "Ubicación cargada en el pedido · Envío") + (S.editId ? " · tocá Guardar ticket para guardar el cambio" : ""));
}
document.addEventListener("dragenter", e => { if (!dragHasText(e)) return; e.preventDefault(); dragDepth++; showDropzone(true, e); });
document.addEventListener("dragover", e => { if (!dragHasText(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; showDropzone(true, e); });
document.addEventListener("dragleave", e => { if (!dragHasText(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) showDropzone(false); });
document.addEventListener("drop", e => {
  if (!dragHasText(e)) return;
  e.preventDefault(); // evita que el navegador abra el enlace y salga de la caja
  dragDepth = 0; const txt = droppedText(e.dataTransfer);
  applyDroppedLocation(txt, e); showDropzone(false);
});
window.addEventListener("dragend", () => { dragDepth = 0; showDropzone(false); });

document.addEventListener("focusout", e => { if (e.target.id === "shiftnotes") { saveNotesNow(); S.notesDraft = null; } });

// Achica la foto a 360×360 px en JPEG para que entre liviana en la base de datos.
function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const W = 360, H = 360; // cuadrada 1:1, recortada al centro
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const ctx = c.getContext("2d");
      const r = Math.max(W / img.width, H / img.height);
      const w = img.width * r, h = img.height * r;
      ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img")); };
    img.src = url;
  });
}

// SHA-256 en JS puro, para no depender de APIs que el navegador puede no dar dentro de esta página.
function sha256hex(str) {
  const b = new TextEncoder().encode(str);
  const K = [], H = []; let p = 2, c = 0;
  const prime = x => { for (let i = 2; i * i <= x; i++) if (x % i === 0) return false; return true; };
  while (c < 64) { if (prime(p)) { if (c < 8) H[c] = (Math.pow(p, .5) * 4294967296) | 0; K[c] = (Math.pow(p, 1 / 3) * 4294967296) | 0; c++; } p++; }
  const l = b.length, total = ((l + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total); m.set(b); m[l] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(total - 4, (l * 8) >>> 0); dv.setUint32(total - 8, Math.floor(l * 8 / 4294967296));
  const w = new Int32Array(64), r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getInt32(o + i * 4);
    for (let i = 16; i < 64; i++) { const a = w[i - 15], d = w[i - 2]; w[i] = (w[i - 16] + (r(a, 7) ^ r(a, 18) ^ (a >>> 3)) + w[i - 7] + (r(d, 17) ^ r(d, 19) ^ (d >>> 10))) | 0; }
    let [A, B, C, D, E, F, G, X] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (X + (r(E, 6) ^ r(E, 11) ^ r(E, 25)) + ((E & F) ^ (~E & G)) + K[i] + w[i]) | 0;
      const t2 = ((r(A, 2) ^ r(A, 13) ^ r(A, 22)) + ((A & B) ^ (A & C) ^ (B & C))) | 0;
      X = G; G = F; F = E; E = (D + t1) | 0; D = C; C = B; B = A; A = (t1 + t2) | 0;
    }
    [A, B, C, D, E, F, G, X].forEach((v, i) => H[i] = (H[i] + v) | 0);
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}
const randSalt = () => { try { return [...crypto.getRandomValues(new Uint8Array(12))].map(x => x.toString(16).padStart(2, "0")).join(""); } catch (e) { return String(Math.random()).slice(2) + Date.now(); } };
const passHash = (user, pass, salt) => sha256hex(salt + "|" + user.trim().toLowerCase() + "|" + pass);

function loadLeaflet() {
  if (window.L && window.L.map) return Promise.resolve(window.L);
  return new Promise((res, rej) => {
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
    const js = document.createElement("script"); js.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    js.onload = () => res(window.L); js.onerror = rej; document.head.appendChild(js);
  });
}
function mountZoneEditor(m) {
  const box = m.querySelector("#zonemap"); if (!box) return;
  let pts = (deliveryZone() || []).map(p => ({lat: p.lat, lng: p.lng}));
  const info = m.querySelector("#c-zinfo");
  loadLeaflet().then(LF => {
    if (!document.body.contains(box)) return;
    box.innerHTML = "";
    const map = LF.map(box, {zoomControl: true});
    LF.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19, attribution: "© OpenStreetMap"}).addTo(map);
    if (pts.length >= 3) map.fitBounds(LF.latLngBounds(pts.map(p => [p.lat, p.lng])).pad(0.25)); else map.setView([-34.765, -56.40], 14);
    const poly = LF.polygon([], {color: "#C2311F", weight: 3, fillOpacity: 0.12}).addTo(map);
    let marks = [];
    const icon = LF.divIcon({className: "zpt", iconSize: [16, 16]});
    const draw = () => {
      poly.setLatLngs(pts.map(p => [p.lat, p.lng]));
      marks.forEach(mk => mk.remove());
      marks = pts.map((p, i) => { const mk = LF.marker([p.lat, p.lng], {draggable: true, icon}).addTo(map);
        mk.on("drag", e => { const ll = e.target.getLatLng(); pts[i] = {lat: ll.lat, lng: ll.lng}; poly.setLatLngs(pts.map(q => [q.lat, q.lng])); });
        return mk; });
      info.textContent = pts.length ? `${pts.length} puntos${pts.length < 3 ? " (faltan " + (3 - pts.length) + ")" : ""}` : "Sin zona";
    };
    map.on("click", e => { pts.push({lat: +e.latlng.lat.toFixed(6), lng: +e.latlng.lng.toFixed(6)}); draw(); });
    m.querySelector("#c-zundo").onclick = () => { pts.pop(); draw(); };
    m.querySelector("#c-zclear").onclick = () => { if (!pts.length || confirm("¿Borrar todos los puntos de la zona?")) { pts = []; draw(); } };
    m.querySelector("#c-zsave").onclick = async () => {
      if (pts.length && pts.length < 3) { toast("La zona necesita al menos 3 puntos.", "bad"); return; }
      const ok = await saveSettings({zone: pts.map(p => ({lat: +(+p.lat).toFixed(6), lng: +(+p.lng).toFixed(6)}))});
      if (ok) toast(pts.length ? "Zona guardada: los envíos fuera de ella se marcan como lejanos" : "Zona borrada: el envío lejano se marca a mano");
    };
    draw();
    setTimeout(() => map.invalidateSize(), 200);
  }).catch(() => { box.innerHTML = `<p class="hint" style="padding:16px">No se pudo cargar el mapa. Revisá la conexión y volvé a abrir Configuración.</p>`; });
}

let tkDraft = null;
function mountConfig() {
  const m = $("#main");
  tkDraft = {logo: S.ticket.logo || "", header: S.ticket.header ?? "Pizzería Pietra", footer: S.ticket.footer ?? "¡Gracias por tu compra!", paper: Number(S.ticket.paper) || 58, autoPrint: !!S.ticket.autoPrint, showName: S.ticket.showName !== false, charset: charsetOf(S.ticket)};
  const setSetting = patch => saveSettings(patch);
  m.querySelectorAll("input[name=c-theme]").forEach(r => r.onchange = () => { S.settings = {...S.settings, theme: r.value}; applyLook(); setSetting({theme: r.value}); });
  m.querySelectorAll("input[name=c-accent]").forEach(r => r.onchange = () => { S.settings = {...S.settings, accent: r.value}; applyLook(); setSetting({accent: r.value}); });
  m.querySelectorAll("input[name=c-dev]").forEach(r => r.onchange = () => { setDeviceSetting(r.value); S.cfgRendered = false; render(); toast(S.phone ? "Este equipo queda como celular" : "Este equipo queda como PC de la caja"); });
  m.querySelectorAll("input[name=c-size]").forEach(r => r.onchange = () => { S.settings = {...S.settings, btnSize: r.value}; applyLook(); setSetting({btnSize: r.value}); });
  m.querySelector("#c-save-local").onclick = async () => {
    const far = Math.round(Number(m.querySelector("#c-far").value));
    if (!(far > 0)) { toast("Poné un monto de envío lejano mayor que 0.", "bad"); return; }
    const cad = Math.round(Number(m.querySelector("#c-cadete").value));
    if (!(cad >= 0)) { toast("Poné un monto fijo del cadete válido (0 o más).", "bad"); return; }
    const ok = await setSetting({businessName: m.querySelector("#c-name").value.trim(), farFee: far, cadeteBase: cad});
    if (ok) toast("Datos del local guardados");
  };
  m.querySelector("#c-save-cad").onclick = async () => {
    const email = m.querySelector("#c-cademail").value.trim().toLowerCase();
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast("Ese correo no parece válido.", "bad"); return; }
    const ok = await setSetting({cadeteEmail: email, deliveryCity: m.querySelector("#c-city").value.trim()});
    if (ok) toast("Datos del cadete guardados");
  };
  mountZoneEditor(m);
  m.querySelector("#c-copyk").onclick = () => { const u = m.querySelector("#c-kurl").textContent; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast("Enlace de la cocina copiado"), () => toast(u)); };
  m.querySelector("#c-copycad").onclick = async () => { try { await navigator.clipboard.writeText(m.querySelector("#c-cadlink").textContent); toast("Enlace copiado"); } catch (e) { toast("No se pudo copiar: seleccioná el enlace y copialo a mano.", "bad"); } };
  m.querySelector("#c-save-auth").onclick = async () => {
    const u = m.querySelector("#c-user").value.trim(), p1 = m.querySelector("#c-pass").value, p2 = m.querySelector("#c-pass2").value;
    if (!u) { toast("El usuario no puede quedar vacío.", "bad"); return; }
    if (p1.length < 4) { toast("La contraseña nueva tiene que tener al menos 4 caracteres.", "bad"); return; }
    if (p1 !== p2) { toast("Las contraseñas no coinciden.", "bad"); return; }
    const salt = randSalt();
    const ok = await save(() => S.db.doc("config/auth").set({user: u, salt, hash: passHash(u, p1, salt), createdAt: Date.now()}), "Acceso actualizado");
    if (ok) { m.querySelector("#c-pass").value = ""; m.querySelector("#c-pass2").value = ""; }
  };
  // Ticket
  let pv = "venta";
  const prev = () => {
    let W, L;
    if (pv === "cierre") { const c = sampleClosing(); const T = {...tkDraft, logo: ""}; W = paperCols(T); L = closingLines(c.sh, c.sales, c.notes, T); m.querySelector("#t-preview").innerHTML = receiptHtmlFromLines(W, L, T); }
    else { const ss = pv === "pendiente" ? {...sampleSale(), status: "pending", payment: null, received: null, change: null} : sampleSale(); ({W, L} = receiptLines(ss, tkDraft)); m.querySelector("#t-preview").innerHTML = receiptHtmlFromLines(W, L, tkDraft); }
    const cm = Math.round((L.length * 0.42 + (pv === "venta" && tkDraft.logo ? 2.5 : 0) + L.filter(l => l.big).length * 0.42 + 1.5) * 10) / 10;
    m.querySelector("#t-pvinfo").textContent = `Ejemplo · ${L.length} renglones · unos ${String(cm).replace(".", ",")} cm de papel`; const lp = m.querySelector("#t-logoprev"); lp.innerHTML = tkDraft.logo ? `<img src="${esc(tkDraft.logo)}" alt="Logo" style="object-fit:contain">` : "Sin logo"; m.querySelector("#t-nologo").hidden = !tkDraft.logo; };
  m.querySelector("#t-header").oninput = e => { tkDraft.header = e.target.value; prev(); };
  m.querySelector("#t-footer").oninput = e => { tkDraft.footer = e.target.value; prev(); };
  m.querySelectorAll("input[name=t-paper]").forEach(r => r.onchange = () => { tkDraft.paper = Number(r.value); prev(); });
  m.querySelectorAll("input[name=t-charset]").forEach(r => r.onchange = () => { tkDraft.charset = r.value; prev(); });
  m.querySelectorAll("input[name=t-pv]").forEach(r => r.onchange = () => { pv = r.value; prev(); });
  m.querySelector("#t-showname").onchange = e => { tkDraft.showName = e.target.checked; prev(); };
  m.querySelector("#t-chartest").onclick = async e => { e.target.disabled = true; const ok = await printCharsetTest(); e.target.disabled = false; if (ok) toast("Prueba impresa: elegí la opción que se lea bien"); };
  m.querySelector("#t-auto").onchange = e => { tkDraft.autoPrint = e.target.checked; };
  m.querySelector("#t-logo").onchange = async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try { tkDraft.logo = await logoImage(f); } catch (err) { toast("No se pudo leer esa imagen. Probá con otra.", "bad"); }
    e.target.value = ""; prev();
  };
  m.querySelector("#t-nologo").onclick = () => { tkDraft.logo = ""; prev(); };
  m.querySelector("#t-save").onclick = async () => {
    const ok = await save(() => S.db.doc("config/ticket").set({...tkDraft}), "Ticket guardado");
    if (ok) S.ticket = {...tkDraft};
  };
  mountPrinter();
  prev();
  const imp = m.querySelector("#c-import"), impMsg = m.querySelector("#c-import-msg");
  imp.onchange = async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
    impMsg.hidden = false; impMsg.style.color = ""; impMsg.textContent = "Leyendo el archivo…";
    try {
      const json = JSON.parse(await f.text());
      const n = await importData(json, t => impMsg.textContent = t);
      impMsg.textContent = `Listo: se importaron ${n} registros.`; toast("Datos importados");
    } catch (err) { impMsg.style.color = "var(--bad)"; impMsg.textContent = "No se pudo importar: " + (err && err.message ? err.message : "el archivo no es válido o no hay conexión."); }
  };
}

// El logo se guarda ya en escala de grises, a lo sumo 384 px de ancho (lo que imprime una térmica de 58 mm).
function logoImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const w = Math.min(384, img.width), h = Math.round(img.height * w / img.width);
      const c = document.createElement("canvas"); c.width = w; c.height = Math.min(h, 300);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/png"));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img")); };
    img.src = url;
  });
}

/* ---------- Ticket: contenido ---------- */
function sampleSale() {
  return {num: 12, createdAt: Date.now(), note: "Martina", mode: "envio", address: "Av. Italia 2345 apto 3", orderNote: "Sin cebolla en la muzzarella", status: "paid", payment: "efectivo", received: 1000, change: 140,
    items: [{name: "Pizza muzzarella", qty: 1, price: 520}, {name: "Porción de fainá", qty: 2, price: 65}, {name: "Coca-Cola 1,5 L", qty: 1, price: 190}], total: 860};
}
const padR = (t, n) => (t.length > n ? t.slice(0, n) : t + " ".repeat(n - t.length));
const pair = (a, b, w) => { const room = Math.max(1, w - b.length - 1); return padR(a, room) + " " + b; };
const money = n => "$" + Math.round(Number(n) || 0).toLocaleString("es-UY");
function wrapText(t, w) {
  const out = []; String(t).split("\n").forEach(line => {
    let cur = ""; line.split(/\s+/).forEach(word => {
      while (word.length > w) { if (cur) { out.push(cur); cur = ""; } out.push(word.slice(0, w)); word = word.slice(w); }
      if (!word) return;
      if ((cur ? cur.length + 1 : 0) + word.length > w) { out.push(cur); cur = word; } else cur = cur ? cur + " " + word : word;
    });
    out.push(cur);
  });
  return out;
}
// Ancho del papel en caracteres (fuente normal de las térmicas): 58 mm = 32, 80 mm = 48.
const paperCols = T => (Number(T.paper) || 58) === 80 ? 48 : 32;
const SEP = "─"; // línea fina; en impresoras sin ese carácter se cambia por "-"
const sepLine = W => ({t: SEP.repeat(W), sep: true});
const fmtDate = ms => { const d = new Date(ms); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
// Encabezado común: logo (se imprime aparte) y/o nombre del local en grande, y los renglones de datos centrados.
function headerLines(T, W) {
  const L = [];
  const head = String(T.header ?? "Pizzería Pietra").split("\n").map(x => x.trim()).filter(Boolean);
  const showName = T.showName !== false || !T.logo;
  head.forEach((h, i) => {
    if (i === 0) { if (!showName) return; const big = h.length <= Math.floor(W / 2); wrapText(h, big ? Math.floor(W / 2) : W).forEach(t => L.push({t, c: true, b: true, big})); }
    else wrapText(h, W).forEach(t => L.push({t, c: true}));
  });
  return L;
}
// Productos en tres columnas alineadas: cantidad | producto | importe.
function itemLines(items, W) {
  const L = [];
  const amounts = (items || []).map(it => money(it.qty * it.price));
  const aw = Math.max(...amounts.map(x => x.length), 4);
  const qw = Math.max(...(items || []).map(it => String(it.qty).length), 1) + 1;
  const nw = Math.max(6, W - qw - aw - 1);
  (items || []).forEach((it, i) => {
    wrapText(it.name, nw).forEach((t, j) => {
      const q = j === 0 ? padR(String(it.qty), qw) : " ".repeat(qw);
      L.push({t: q + padR(t, nw) + (j === 0 ? " " + amounts[i].padStart(aw) : "")});
    });

// Devuelve renglones con alineación y estilo; los usan la vista previa y la impresora.
function receiptLines(sale, T) {
  const W = paperCols(T), H = Math.floor(W / 2);
  const L = headerLines(T, W);
  // Rótulo de la copia en negativo (blanco sobre negro): ocupa un solo renglón y se distingue de lejos.
  const kind = sale._copy || (sale.status === "pending" ? "pending" : "paid");
  const label = kind === "pending" ? "PEDIDO PENDIENTE" : "COMPROBANTE DE PAGO";
  const lab = " " + label + " ", side = Math.max(0, Math.floor((W - lab.length) / 2));
  L.push({t: " ".repeat(side) + lab + " ".repeat(Math.max(0, W - side - lab.length)), b: true, inv: true});
  if (sale._updated) L.push({t: `(actualizado ${fmtDate(sale._updated).slice(-5)})`, c: true});
  else if (sale._reprint) L.push({t: "(reimpresión)", c: true});
  L.push({t: pair(`Ticket ${sale.num ?? ""}`, fmtDate(kind === "pending" ? sale.createdAt : (sale.paidAt || sale.createdAt)), W), b: true});
  const who = [sale.note, sale.mode === "envio" ? "ENVÍO" : sale.mode === "retiro" ? "RETIRO" : ""].filter(Boolean).join(" · ");
  if (who) wrapText(who, W).forEach(t => L.push({t, b: true}));
  if (sale.mode === "envio" && sale.address) wrapText(addressShort(sale.address), W).forEach(t => L.push({t}));
  L.push(sepLine(W));
  L.push(...itemLines(sale.items, W));
  if (sale.orderNote) { L.push(sepLine(W)); wrapText("NOTA: " + sale.orderNote, W).forEach(t => L.push({t, b: true})); }
  L.push(sepLine(W));
  L.push({t: pair(kind === "pending" ? "A COBRAR" : "TOTAL", money(sale.total), H), b: true, big: true});
  if (kind === "pending") L.push({t: "Todavía no se cobró", c: true});
  else if (sale.payment) {
    L.push({t: pair("Pago", PAY[sale.payment] || sale.payment, W)});
    if (sale.payment === "efectivo" && sale.change) { L.push({t: pair("Entregó", money(sale.received), W)}); L.push({t: pair("Vuelto", money(sale.change), W)}); }
    if (Number(sale.tipCard) > 0) L.push({t: pair("Propina delivery (tarjeta)", money(sale.tipCard), W)});
  }
  const foot = String(T.footer ?? "").split("\n").map(x => x.trim()).filter(Boolean);
  if (foot.length) { L.push(sepLine(W)); foot.forEach(f => wrapText(f, W).forEach(t => L.push({t, c: true}))); }
  return {W, L};
}
// Vista previa: papel del ancho real; los renglones grandes ocupan doble ancho, como en la impresora.
function receiptHtmlFromLines(W, L, T) {
  const ascii = T.charset === "ascii";
  const txt = t => ascii ? String(t).replace(/─/g, "-").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[¿¡]/g, "") : t;
  // Sin espacios entre etiquetas: el papel usa white-space:pre y los mostraría como renglones vacíos.
  return `<div class="receipt" style="--cols:${W}" role="img" aria-label="Vista previa del ticket">${T.logo ? `<img src="${esc(T.logo)}" alt="">` : ""}${L.map(l => `<div class="${l.c ? "c " : ""}${l.b ? "b " : ""}${l.big ? "big " : ""}${l.sep ? "sep " : ""}${l.inv ? "inv" : ""}">${esc(txt(l.t)) || " "}</div>`).join("")}<div class="cut" aria-hidden="true"></div></div>`;
}
function receiptHtml(sale, T) { const {W, L} = receiptLines(sale, T); return receiptHtmlFromLines(W, L, T); }

const PRINTER_SERVICES = [

  "49535343-fe7d-4ae5-8fa9-9fafd205e455", "0000ff00-0000-1000-8000-00805f9b34fb",

function mountPrinter() {
  const box = $("#c-printer"); if (!box) return;
  box.innerHTML = printerCard();
  const on = box.querySelector("#p-on"), off = box.querySelector("#p-off"), test = box.querySelector("#p-test");
  if (on) on.onclick = async () => { on.disabled = true; on.textContent = "Buscando…"; printerMsg = ""; await connectPrinter(); mountPrinter(); render(); };
  if (off) off.onclick = () => { try { S.printer.dev.gatt.disconnect(); } catch (e) {} S.printer = null; mountPrinter(); render(); };

async function connectPrinter() {
  try {
    const dev = await navigator.bluetooth.requestDevice({acceptAllDevices: true, optionalServices: PRINTER_SERVICES});
    const server = await dev.gatt.connect();
    let ch = null;
    for (const uuid of PRINTER_SERVICES) {
      try { const svc = await server.getPrimaryService(uuid); const cs = await svc.getCharacteristics(); ch = cs.find(c => c.properties.writeWithoutResponse || c.properties.write); if (ch) break; } catch (e) {}
    }
    if (!ch) { try { dev.gatt.disconnect(); } catch (e) {} printerMsg = "Se conectó, pero ese aparato no acepta impresiones. Revisá que sea una impresora térmica BLE."; return; }
    S.printer = {dev, ch, name: dev.name || "Impresora"};
    dev.addEventListener("gattserverdisconnected", () => { S.printer = null; render(); mountPrinter(); toast("Se desconectó la impresora", "bad"); });
    toast("Impresora conectada");
  } catch (e) {
    const n = e && e.name, msg = String(e && e.message || "");
    if (n === "NotFoundError" && /cancel/i.test(msg)) printerMsg = "";
    else if (n === "NotFoundError") printerMsg = "No se encontró ninguna impresora. Revisá que esté prendida y con Bluetooth activo.";
    else if (n === "SecurityError" || n === "NotAllowedError" || /policy|disallowed|permission/i.test(msg)) printerMsg = "El navegador no permite usar Bluetooth dentro de esta página.";
    else if (n === "NetworkError") printerMsg = "No se pudo conectar. Acercá la impresora y probá de nuevo.";
    else printerMsg = "No se pudo conectar la impresora (" + esc(n || "error") + ").";
  }
}

// Tablas de caracteres de las impresoras térmicas (ESC/POS). La 850 es la más común para español.
const CP850 = {"á":0xA0,"é":0x82,"í":0xA1,"ó":0xA2,"ú":0xA3,"ñ":0xA4,"Ñ":0xA5,"ü":0x81,"Ü":0x9A,"Á":0xB5,"É":0x90,"Í":0xD6,"Ó":0xE0,"Ú":0xE9,"¿":0xA8,"¡":0xAD,"°":0xF8,"º":0xA7,"ª":0xA6,"─":0xC4,"·":0xFA};
const CP437 = {"á":0xA0,"é":0x82,"í":0xA1,"ó":0xA2,"ú":0xA3,"ñ":0xA4,"Ñ":0xA5,"ü":0x81,"Ü":0x9A,"É":0x90,"¿":0xA8,"¡":0xAD,"°":0xF8,"º":0xA7,"ª":0xA6,"─":0xC4,"·":0xFA};
const CHARSETS = {cp850: {n: 2, map: CP850}, cp437: {n: 0, map: CP437}, ascii: {n: 0, map: {}}};
const charsetOf = T => CHARSETS[T && T.charset] ? T.charset : "cp850";
function encText(t, cs = "cp850") {
  const map = CHARSETS[cs].map, out = [];
  for (const ch of String(t)) {
    const c = ch.charCodeAt(0);
    if (c < 128) out.push(c);
    else if (map[ch] != null) out.push(map[ch]);
    else if (ch === "─") out.push(45);
    else if (ch === "¿" || ch === "¡") continue;
    else { const base = ch.normalize("NFD").replace(/[̀-ͯ]/g, ""); out.push(base.charCodeAt(0) < 128 ? base.charCodeAt(0) : 63); }
  }
  return out;
}
function logoRaster(dataUrl, dots) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = Math.min(Math.round(dots * 0.6), img.width); w -= w % 8; if (w < 8) { resolve([]); return; }
      const h = Math.round(img.height * w / img.width);
      const c = document.createElement("canvas"); c.width = dots; c.height = h;
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, dots, h); x.drawImage(img, Math.round((dots - w) / 2), 0, w, h);
      const px = x.getImageData(0, 0, dots, h).data, bpr = dots / 8;
      const out = [0x1D, 0x76, 0x30, 0x00, bpr & 255, bpr >> 8, h & 255, h >> 8];
      for (let y = 0; y < h; y++) for (let bx = 0; bx < bpr; bx++) {
        let byte = 0;
        for (let bit = 0; bit < 8; bit++) { const i = (y * dots + bx * 8 + bit) * 4; const lum = .299 * px[i] + .587 * px[i + 1] + .114 * px[i + 2]; if (lum < 150 && px[i + 3] > 100) byte |= 0x80 >> bit; }
        out.push(byte);
      }
      out.push(0x0A); resolve(out);
    };
    img.onerror = () => resolve([]);
    img.src = dataUrl;
  });
}
async function escposFor(sale, T) { return escposLines(receiptLines(sale, T).L, T); }
async function escposLines(L, T) {
  const dots = (Number(T.paper) || 58) === 80 ? 576 : 384;
  const cs = charsetOf(T);
  const b = [0x1B, 0x40, 0x1B, 0x74, CHARSETS[cs].n];
  if (T.logo) { b.push(0x1B, 0x61, 0x01); b.push(...await logoRaster(T.logo, dots)); }
  L.forEach(l => {
    b.push(0x1B, 0x61, l.c ? 1 : 0, 0x1B, 0x45, l.b ? 1 : 0, 0x1D, 0x21, l.big ? 0x11 : 0x00, 0x1D, 0x42, l.inv ? 1 : 0);
    b.push(...encText(l.t, cs), 0x0A);
  });
  // Avance justo para llegar al corte (3 renglones) y corte parcial.
  b.push(0x1B, 0x61, 0, 0x1D, 0x21, 0, 0x1B, 0x45, 0, 0x1D, 0x42, 0, 0x1B, 0x64, 0x03, 0x1D, 0x56, 0x42, 0x00);
  return new Uint8Array(b);
}
async function printSale(sale, T) { return printBytes(() => escposFor(sale, T || S.ticket)); }
async function printBytes(make) {
  if (!S.printer) { toast("No hay impresora conectada.", "bad"); return false; }
  try {
    const bytes = await make();
    const ch = S.printer.ch, size = 180;
    for (let i = 0; i < bytes.length; i += size) {
      const part = bytes.slice(i, i + size);
      if (ch.properties.writeWithoutResponse && ch.writeValueWithoutResponse) await ch.writeValueWithoutResponse(part);
      else await ch.writeValue(part);
      await new Promise(r => setTimeout(r, 25));
    }
    return true;
  } catch (e) { toast("No se pudo imprimir. Revisá que la impresora siga prendida y conectada.", "bad"); return false; }
}
function autoPrint(sale) { if (sale && S.printer && S.ticket.autoPrint) printCopy(sale, "paid"); }
// Copias automáticas: "pending" al guardar un pedido y "paid" al cobrarlo. Cada ticket guarda en la cuenta
// qué copia ya salió (printedPending / printedPaid), así no se repite aunque se toque dos veces o se cobre desde otro equipo.
const printingNow = new Set();
async function printCopy(sale, kind, opts = {}) {
  if (!sale || !S.printer) return false;
  const flag = kind === "pending" ? "printedPending" : "printedPaid";
  const key = (sale.id || sale.num) + ":" + kind;
  const live = sale.id ? S.sales.find(x => x.id === sale.id) : null;
  const already = !!(sale[flag] || (live && live[flag]));
  if (!opts.manual && (already || printingNow.has(key))) return false;
  printingNow.add(key);
  // Copia manual de un pedido que cambió desde la última impresión: se marca "actualizado".
  const lastAt = (live && live.printedPendingAt) || sale.printedPendingAt || 0;
  const updated = opts.manual && kind === "pending" && already && sale.editedAt && sale.editedAt > lastAt ? sale.editedAt : 0;
  const ok = await printSale({...sale, _copy: kind, _reprint: !!opts.manual && already && !updated, _updated: updated});
  printingNow.delete(key);
  if (ok && sale.id && (!already || kind === "pending")) queue("update", "sales/" + sale.id, kind === "pending" ? {printedPending: true, printedPendingAt: Date.now()} : {printedPaid: true}, `Ticket #${sale.num}: ${kind === "pending" ? "copia de pedido" : "comprobante"} impreso`);
  return ok;
}
// Botón "Imprimir ticket" de un pedido guardado: imprime cómo está ahora (también lo que se está editando sin guardar).
async function printPendingNow(sale, btn) {
  if (!sale || !isPending(sale)) return;
  if (!S.printer) { toast("Conectá la impresora (arriba, en el estado de la impresora) para imprimir.", "bad"); return; }
  const label = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "Imprimiendo…"; }
  const ok = await printCopy(sale, "pending", {manual: true});
  if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = label; }
  if (ok) toast(`Ticket #${sale.num} impreso`);
}

// Ticket de cierre de turno: resumen de ventas, cobros, caja, cadete, productos y notas.
function closingLines(sh, sales, notes, T) {
  const W = paperCols(T);
  const m = sh.summary || summarize(sales || [], sh.openingCash, shiftCadeteBase(sh));
  const L = [], hr = () => L.push(sepLine(W)), row = (a, b, o = {}) => L.push({t: pair(a, b, W), ...o});
  const head = String(T.header ?? "Pizzería Pietra").split("\n").filter(x => x.trim());
  if (head.length) wrapText(head[0].trim(), Math.floor(W / 2)).forEach(t => L.push({t, c: true, b: true, big: true}));
  hr(); L.push({t: "CIERRE DE TURNO", c: true, b: true, big: true});
  const d1 = new Date(sh.openedAt), d2 = new Date(sh.closedAt || Date.now());
  const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  L.push({t: `${pad(d1.getDate())}/${pad(d1.getMonth() + 1)}/${d1.getFullYear()} · ${hm(d1)} a ${hm(d2)}`, c: true});
  hr();
  L.push({t: pair("TOTAL", money(m.total), Math.floor(W / 2)), b: true, big: true});
  row("Ventas cobradas", String(m.count || 0));
  if (m.count) row("Ticket promedio", money(m.avg));
  row(`Efectivo (${m.cashCount || 0})`, money(m.cash));
  row(`POS (${m.posCount || 0})`, money(m.pos));
  if (m.cancelledCount) row(`Anuladas (${m.cancelledCount})`, money(m.cancelledTotal));
  hr(); L.push({t: "CAJA", b: true});
  row("Fondo inicial", money(m.opening));
  row("Efectivo esperado", money(m.expectedCash), {b: true});
  if (sh.countedCash != null) {
    const diff = sh.countedCash - m.expectedCash;
    row("Contado", money(sh.countedCash));
    row(Math.round(diff) === 0 ? "Diferencia" : diff < 0 ? "Faltante" : "Sobrante", money(Math.abs(diff)), {b: true});
  }
  hr(); L.push({t: "CADETE", b: true});
  const base = m.cadeteBase != null ? m.cadeteBase : shiftCadeteBase(sh);
  row("Fijo del turno", money(base));
  row(`Salidas lejanas (${m.farCount || 0})`, money(m.farTotal));
  row(`Propinas tarjeta (${m.tipCount || 0})`, money(m.tipTotal || 0));
  row("A pagar", money(m.cadeteTotal != null ? m.cadeteTotal : base + (m.farTotal || 0) + (m.tipTotal || 0)), {b: true});
  if ((m.products || []).length) {
    hr(); L.push({t: "PRODUCTOS", b: true});
    L.push(...itemLines(m.products.map(p => ({name: p.name, qty: p.qty, price: p.qty ? p.total / p.qty : 0})), W));
  }
  if (notes && notes.trim()) { hr(); L.push({t: "NOTAS DEL TURNO", b: true}); wrapText(notes.trim(), W).forEach(t => L.push({t})); }
  hr(); L.push({t: "Impreso " + fmtDate(Date.now()), c: true});
  return L;
}
function printCharsetTest() {

// Traduce los errores de Firebase a los que ya maneja la app.
const FB_PERMANENT = new Set(["permission-denied", "not-found", "invalid-argument", "failed-precondition", "unauthenticated", "out-of-range", "already-exists"]);
const fbErr = e => { const c = e && e.code; return {code: FB_PERMANENT.has(c) ? "invalid_argument" : c === "resource-exhausted" ? "quota_exceeded" : "unavailable", raw: c, message: e && e.message}; };

const fbSnap = (target, next, error) => target.onSnapshot({includeMetadataChanges: true}, next, e => error && error(fbErr(e)));
function wrapDoc(ref) {
  return {
    id: ref.id, path: ref.path,
    get: () => fbP(ref.get()), set: d => fbP(ref.set(d)), update: d => fbP(ref.update(d)), delete: () => fbP(ref.delete()),
    onSnapshot: (n, e) => fbSnap(ref, n, e), collection: p => wrapColl(ref.collection(p))
  };
}
function wrapQuery(q) {
  return {
    where: (...a) => wrapQuery(q.where(...a)), orderBy: (...a) => wrapQuery(q.orderBy(...a)), limit: n => wrapQuery(q.limit(n)),
    get: () => fbP(q.get()), onSnapshot: (n, e) => fbSnap(q, n, e)
  };
}
function wrapColl(c) { return {...wrapQuery(c), path: c.path, doc: id => wrapDoc(id ? c.doc(id) : c.doc()), add: d => fbP(c.add(d))}; }
const makeDb = fs => ({doc: p => wrapDoc(fs.doc(p)), collection: p => wrapColl(fs.collection(p))});

      <label class="field"><span>Contraseña</span><input id="lg-pass" type="password" autocomplete="current-password" required></label>
      <p class="hint" id="lg-err" style="margin:0;color:var(--bad)" hidden></p>
      <button class="btn primary lg" type="submit" id="lg-btn">Entrar</button>
    </form>`;
  box.hidden = false;
  const f = box.querySelector("#lgform"), err = box.querySelector("#lg-err"), btn = box.querySelector("#lg-btn");
  f.onsubmit = async e => {
    e.preventDefault(); err.hidden = true; btn.disabled = true; btn.textContent = "Entrando…";
    try { await AUTH.signInWithEmailAndPassword(box.querySelector("#lg-email").value.trim(), box.querySelector("#lg-pass").value); }
    catch (x) {
      const c = x && x.code;
      err.textContent = c === "auth/too-many-requests" ? "Demasiados intentos. Esperá unos minutos y probá de nuevo."
        : c === "auth/network-request-failed" ? "No hay conexión. Para entrar la primera vez en este equipo hace falta internet."
        : c === "auth/invalid-email" ? "Ese correo no es válido."
        : "Correo o contraseña incorrectos.";
      err.hidden = false; btn.disabled = false; btn.textContent = "Entrar";
    }
  };
  setTimeout(() => { const i = box.querySelector("#lg-email"); if (i) i.focus(); }, 50);
}
function hideLogin() { const b = $("#login"); b.hidden = true; b.innerHTML = ""; }
let logoutArmed = 0;
function confirmLogout() {
  if (Date.now() - logoutArmed < 6000) return true;
  logoutArmed = Date.now();
  toast(`Hay ${plural(OB.ops.length, "cambio sin sincronizar", "cambios sin sincronizar")}. Si cerrás sesión ahora se pueden perder. Tocá otra vez para cerrar igual.`, "bad");
  return false;
}

// Importa el archivo exportado de la versión anterior (una sola vez).
async function importData(json, progress) {
  const ops = [];
  Object.entries(json.collections || {}).forEach(([coll, docs]) => (docs || []).forEach(d => { if (d && d.id && d.data) ops.push([coll + "/" + d.id, d.data]); }));
  Object.entries(json.docs || {}).forEach(([path, data]) => { if (data) ops.push([path, data]); });
  if (!ops.length) throw new Error("el archivo no tiene datos.");
  for (let i = 0; i < ops.length; i += 400) {
    const b = FS.batch();
    ops.slice(i, i + 400).forEach(([path, data]) => b.set(FS.doc(path), data));
    progress && progress(`Importando ${Math.min(i + 400, ops.length)} de ${ops.length}…`);
    await withTimeout(b.commit(), 30000);
  }
  return ops.length;
}

init();
