<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizzería Pietra</title>
<meta name="theme-color" content="#C2311F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pietra">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Mostrador de piedra: neutros grises, rojo tomate como acento, gris oscuro para la sección activa. Catálogo a la izquierda, ticket a la derecha; en PC todo entra en una pantalla. */
  --bg:#E8E6E2; --on-bg:#1D1C1A; --on-bg-muted:#66625C; --tab-on:#3A3A3C; --surface:#FFFFFF; --sunk:#F2F1EE; --ink:#1D1C1A; --muted:#66625C; --line:#D5D1CA;
  --accent:#C2311F; --accent-ink:#FFFFFF; --accent-soft:#F7E2DE;
  --ok:#2C6E3F; --ok-soft:#DCEEDF; --warn:#8F5A0E; --warn-soft:#F6EAD2; --bad:#B42318; --bad-soft:#F9DEDA;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161514; --on-bg:#F0EEE9; --on-bg-muted:#A39F97; --tab-on:#4A4A4D; --surface:#21201E; --sunk:#1B1A19; --ink:#F0EEE9; --muted:#A39F97; --line:#36342F;
    --accent:#E4513D; --accent-ink:#FFFFFF; --accent-soft:#3A201B;
    --ok:#62BC7B; --ok-soft:#1D3324; --warn:#E3A64A; --warn-soft:#3A2D16; --bad:#F07264; --bad-soft:#3E1D19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161514; --on-bg:#F0EEE9; --on-bg-muted:#A39F97; --tab-on:#4A4A4D; --surface:#21201E; --sunk:#1B1A19; --ink:#F0EEE9; --muted:#A39F97; --line:#36342F;
  --accent:#E4513D; --accent-ink:#FFFFFF; --accent-soft:#3A201B;
  --ok:#62BC7B; --ok-soft:#1D3324; --warn:#E3A64A; --warn-soft:#3A2D16; --bad:#F07264; --bad-soft:#3E1D19;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
#login{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom))}
.login-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.login-card .brand h1{font-size:30px}
.login-card input{font-size:16px}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100%}

/* Barra superior */
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:8px}
.brand h1{font-size:24px;font-weight:800}
.brand small{color:var(--muted);font-size:13px}
.gear{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.gear:hover{color:var(--ink);border-color:var(--ink)}
.gear[aria-current="page"]{background:var(--tab-on);color:#fff;border-color:var(--tab-on)}
.gear svg{width:18px;height:18px}
.prtdot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
/* Configuración */
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px;align-items:start}
.cfg .card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer}
.swatch i{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch input{position:absolute;opacity:0;pointer-events:none}
.swatch:has(input:checked) i{box-shadow:0 0 0 3px var(--ink)}
.swatch:has(input:focus-visible) i{outline:3px solid var(--accent);outline-offset:3px}
textarea.text{min-height:76px;resize:vertical;font-family:var(--body)}
.tk-wrap{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
/* Vista previa del ticket: papel térmico del ancho real (1 letra = 1ch), los renglones grandes a doble ancho. */
.receipt{--cols:32;box-sizing:content-box;width:calc(var(--cols) * 1ch);background:#FFFFFF;color:#141414;font:13px/1.3 ui-monospace,"SFMono-Regular","Cascadia Mono",Menlo,Consolas,monospace;padding:16px 12px 0;border-radius:3px 3px 0 0;box-shadow:0 6px 20px rgba(0,0,0,.18);white-space:pre;overflow:hidden;position:relative}
.receipt > div{min-height:1.3em}
.receipt .c{text-align:center}
.receipt .b{font-weight:700}
.receipt .big{font-size:2em;line-height:1.15;letter-spacing:0}
.receipt .sep{color:#9A9A9A}
.receipt .inv{background:#141414;color:#FFFFFF}
.receipt img{display:block;margin:0 auto 6px;max-width:60%;max-height:90px;object-fit:contain;filter:grayscale(1) contrast(1.6)}
.receipt .cut{height:14px;margin:10px -12px 0;background:linear-gradient(135deg,#FFFFFF 50%,transparent 50%) 0 0/12px 12px repeat-x,linear-gradient(225deg,#FFFFFF 50%,transparent 50%) 0 0/12px 12px repeat-x}
.tk-preview{display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--sunk);border-radius:12px;padding:14px;min-width:0}
.tk-preview .seg{width:100%;max-width:400px}
.tk-preview .seg label{padding:8px 4px;font-size:13px}
.tk-preview #t-preview{max-width:100%;overflow-x:auto}
.statusline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.login{max-width:420px}
@media (max-width:900px){ .tk-wrap{grid-template-columns:1fr} .cfg{grid-template-columns:1fr} }
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted)}
nav.tabs button:hover{background:var(--sunk);color:var(--ink)}
nav.tabs button[aria-current="page"]{background:var(--tab-on);color:#FFFFFF}
nav.tabs .dot{display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:600;margin-left:6px;text-align:center}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.off{background:var(--sunk);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.plain::before{display:none}
.syncbtn{border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600}
.syncbtn:hover{filter:brightness(.96)}
.pill.envio{background:var(--accent-soft);color:var(--accent)}
.tile.cadete{border-style:dashed;background:var(--sunk)}
.locinfo{font-size:13px;line-height:1.5;margin-top:-4px;overflow-wrap:anywhere}
.loclinks{display:inline-flex;gap:10px;margin-left:4px}
.loclinks a{color:var(--accent);font-weight:600}
.pill.tip{background:var(--sunk);color:var(--ink);border:1px dashed var(--line)}
.tipfield{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--sunk)}
tr.totrow td{border-top:2px solid var(--line)}
.supplier{font-size:13px;color:var(--muted);margin-top:2px}
.savedbtn.late{border-color:var(--bad);background:var(--bad-soft)}
.savedbtn.late .n{background:var(--bad)}
.late-tag{display:inline-flex;align-items:center;gap:4px;color:var(--bad);font-size:12px;font-weight:700}
.late-tag svg,.late-alert svg{width:15px;height:15px;flex:none}
.late-alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--bad-soft);color:var(--ink);font-size:14px}
.late-alert svg{color:var(--bad);margin-top:2px}
.srow.late{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.age{font-weight:600;color:var(--ink)}
.age.late{color:var(--bad)}
.toast.warn{background:var(--warn);color:#fff}
.notesbody{padding:12px 16px 16px}
#shiftnotes{display:block;width:100%;min-height:220px;resize:vertical;background:#FFFFFF;color:#141414;caret-color:#141414;border:1px solid #CFCAC2;border-radius:10px;padding:12px 14px;font:16px/1.55 var(--body);color-scheme:light}
#shiftnotes::placeholder{color:#8A857D}
#shiftnotes:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:transparent}
body.phone #shiftnotes{min-height:200px}
#printerpill .pill{border:0}
@media (max-width:1440px){ #gearlabel{display:none} .gear{padding:0 10px} }
.top .pill{white-space:nowrap}
.onote{display:inline-block;margin-top:3px;padding:1px 7px;border-radius:6px;background:var(--warn-soft);color:var(--ink);font-size:13px;font-weight:600}
.seg.compact label{padding:8px;font-size:15px}
.tfoot textarea.text{min-height:48px}
.tfoot .field > span{font-size:12px}
.tfoot{gap:10px}
.banner{margin:0;padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border-bottom:1px solid var(--line);font-size:14px}
.banner.bad{background:var(--bad-soft)}
main{overflow:auto;min-height:0}
.page{padding:20px 24px;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.page-head h2{font-size:26px}
.page-head .spacer{flex:1}
.page-head h2,.page-head > .muted,.page > .hint,.page > p.muted,.catgroup h3{color:var(--on-bg)}
.page > .hint{color:var(--on-bg-muted)}
.page-head .btn.ghost{color:var(--on-bg);border-color:var(--on-bg-muted)}

/* Botones */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:var(--r);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.danger-ghost{background:transparent;color:var(--bad);border-color:transparent}
.btn.danger-ghost:hover{border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:14px 18px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{border:0;background:transparent;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:20px;line-height:1;color:var(--muted)}
.icon:hover{background:var(--sunk);color:var(--ink)}

/* Vender */
.sell{display:grid;grid-template-columns:1fr 400px;height:100%;min-height:0}
@media (min-width:1500px){.sell{grid-template-columns:1fr 440px}}
.catalog{overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-height:0}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.catgroup h3{font-size:15px;color:var(--muted);font-family:var(--body);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:4px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.prod{position:relative;aspect-ratio:1/1;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:6px;transition:transform .08s;overflow:hidden}
.prod:hover{border-color:var(--ink)}
.prod:active{transform:scale(.97)}
.prod:disabled{cursor:not-allowed;opacity:.6}
.prod .n{font-weight:600;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.prod .p{font-family:var(--display);font-weight:700;font-size:20px}
.prod .q{position:absolute;top:8px;right:8px;z-index:2;background:var(--accent);color:var(--accent-ink);min-width:28px;height:28px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:14px;padding:0 7px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.prod.in{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent) inset}
.prod.has-img{padding:0;border:0;background:var(--sunk)}
.prod .img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prod.has-img .txt{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;display:flex;flex-direction:column;gap:2px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff}
.prod.has-img .n{text-shadow:0 1px 3px rgba(0,0,0,.6)}
.prod.has-img.in::after{content:"";position:absolute;inset:0;border:3px solid var(--accent);border-radius:14px;pointer-events:none}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:-18px;z-index:2;background:var(--bg);padding:6px 0 8px;margin-top:-6px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px 10px 36px}
.search::before{content:"";position:absolute;left:13px;top:50%;width:11px;height:11px;border:2px solid var(--muted);border-radius:50%;transform:translateY(-60%)}
.search::after{content:"";position:absolute;left:24px;top:58%;width:6px;height:2px;background:var(--muted);transform:rotate(45deg)}
.zonemap{height:380px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sunk)}
.zpt{background:#fff;border:3px solid #C2311F;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tripbtn{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 6px 8px 14px;font-weight:700;cursor:pointer;display:inline-flex;gap:10px;align-items:center}
.tripbtn span{background:var(--ink);color:var(--surface);border-radius:8px;padding:2px 10px;font-size:13px}
.kitchenbtn{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.kitchenbtn .n{background:var(--ink);color:var(--surface);border-radius:999px;padding:0 8px;font-size:13px}
.kitchenbtn.zero .n{background:var(--sunk);color:var(--muted)}
.krow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.krow.late{border-color:var(--bad)} .krow.warn{border-color:var(--warn)}
.krow .num{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted)}
.krow .its{font-size:14px;color:var(--muted)}
.klist{display:flex;flex-direction:column;gap:8px}
.savedbtn{border:2px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.savedbtn:hover{filter:brightness(1.04)}
.savedbtn .n{background:var(--warn);color:#fff;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px}
.savedbtn.zero{border-color:var(--line);background:var(--surface);color:var(--muted)}
.savedbtn.zero .n{background:var(--sunk);color:var(--muted)}
.ticket.editing{box-shadow:inset 0 4px 0 var(--warn)}
.editbar{display:flex;gap:8px;align-items:center;padding:8px 18px;background:var(--warn-soft);font-size:14px;font-weight:600}
.saved-list{display:flex;flex-direction:column;gap:8px}
#dropzone{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(20,16,12,.35);pointer-events:none}
#dropzone>div{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;background:var(--surface);color:var(--ink);border:3px dashed var(--accent);border-radius:20px;padding:28px 40px;font-size:15px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#dropzone strong{font-family:var(--display);font-size:24px}
#dropzone.onrows{background:transparent;align-items:flex-start;padding-top:18px}
#dropzone.onrows>div{padding:12px 24px}
.srow.dropover{outline:3px dashed var(--accent);outline-offset:2px;background:var(--sunk)}
.srow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.srow:hover{border-color:var(--ink)}
.srow .num{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted)}
.srow .who{font-weight:600}
.srow .what{font-size:13px;color:var(--muted)}
.srow .amt{font-family:var(--display);font-weight:700;font-size:18px;text-align:right}
.srow .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
kbd{font:600 11px/1 var(--body);border:1px solid currentColor;border-radius:4px;padding:2px 4px;opacity:.7;margin-left:4px}
.kbd-hint{display:none}
@media (min-width:1000px) and (pointer:fine){ .kbd-hint{display:inline} }
.shortcuts{display:none;font-size:12px;color:var(--muted);gap:12px;flex-wrap:wrap}
@media (min-width:1000px) and (pointer:fine){ .shortcuts{display:flex} }
/* Animación de cobro */
.burst{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.burst .bill{position:absolute;left:50%;top:50%;width:68px;height:34px;margin:-17px 0 0 -34px;background:linear-gradient(160deg,#4FAA68,#2A7440);border:2px solid #1D5530;border-radius:5px;display:grid;place-items:center;color:#E8F7EC;font:800 17px var(--display);box-shadow:0 4px 10px rgba(0,0,0,.25)}
.burst .bill::before{content:"";position:absolute;inset:4px;border:1px solid rgba(255,255,255,.35);border-radius:3px}
.burst .coin{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE89A,#D9A21B 70%);border:2px solid #A57A0D;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.burst-label{position:absolute;left:50%;top:50%;background:var(--surface);color:var(--ink);padding:18px 30px;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;display:flex;flex-direction:column;gap:2px;transform:translate(-50%,-50%)}
.burst-label span{font-weight:600;color:var(--muted)}
.burst-label strong{font:800 42px var(--display);color:var(--ok)}
.farbox{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:600}
.farbox input{width:20px;height:20px;accent-color:var(--accent)}
.farbox small{color:var(--muted);font-weight:400;margin-left:auto}
.thumb{width:38px;height:38px;border-radius:6px;object-fit:cover;vertical-align:middle;margin-right:10px;background:var(--sunk)}
.newcat{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.field select{appearance:auto}
.imgpick{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgpick .prev{width:120px;aspect-ratio:1/1;border-radius:10px;border:1px dashed var(--line);background:var(--sunk);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:13px}
.imgpick .prev img{width:100%;height:100%;object-fit:cover}
.seg.two-opt{grid-template-columns:1fr 1fr}

/* ---------- Animaciones sutiles (transform y opacity, cortas, sin bloquear controles) ---------- */
@keyframes fx-bump{0%{transform:scale(1)}35%{transform:scale(.94)}70%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes fx-line-in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes fx-qty{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes fx-flash{0%{background-color:var(--accent-soft)}100%{background-color:transparent}}
@keyframes fx-pill{0%{transform:scale(.8);opacity:.4}55%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes fx-ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
@keyframes fx-view{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fx-fade{from{opacity:0}to{opacity:1}}
@keyframes fx-card{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
@keyframes fx-draw{to{stroke-dashoffset:0}}
@keyframes fx-tick{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.15)}100%{transform:scale(1)}}
.fx-bump{animation:fx-bump .26s ease-out}
.fx-line-in{animation:fx-line-in .22s ease-out, fx-flash .9s ease-out}
.fx-qty{display:inline-block;animation:fx-qty .22s ease-out}
.fx-pill{position:relative;animation:fx-pill .45s cubic-bezier(.2,.8,.3,1.2)}
.fx-pill::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 2px var(--ok);animation:fx-ring .9s ease-out .1s both;pointer-events:none}
.fx-view{animation:fx-view .18s ease-out}
.tick{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-weight:600}
.tick svg{width:14px;height:14px}
.tick.fx-tick svg{animation:fx-tick .35s ease-out}
.closing-fx{position:fixed;inset:0;z-index:75;display:grid;place-items:center;pointer-events:none;background:rgba(20,18,16,.28);animation:fx-fade .18s ease-out}
.closing-fx.out{opacity:0;transition:opacity .3s ease-in}
.closing-card{background:var(--surface);color:var(--ink);border-radius:20px;padding:24px 32px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:fx-card .25s ease-out;text-align:center}
.closing-card svg{width:64px;height:64px}
.closing-card circle{fill:var(--ok-soft);stroke:var(--ok);stroke-width:3}
.closing-card path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:48;stroke-dashoffset:48;animation:fx-draw .4s ease-out .15s forwards}
.closing-card strong{font:800 22px var(--display)}
.closing-card span{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
  .fx-bump,.fx-line-in,.fx-qty,.fx-pill,.fx-view,.closing-fx,.closing-card,.tick.fx-tick svg{animation:none !important}
  .fx-pill::after{display:none}
  .closing-card path{animation:none;stroke-dashoffset:0}
}

const fmt = n => "$ " + Math.round(Number(n) || 0).toLocaleString("es-UY");

const CADETE_BASE_DEFAULT = 1000; // Monto fijo que cobra el cadete por turno.
const cadeteBase = () => S.settings.cadeteBase != null && Number(S.settings.cadeteBase) >= 0 ? Number(S.settings.cadeteBase) : CADETE_BASE_DEFAULT;
const shiftCadeteBase = sh => sh && sh.cadeteBase != null ? Number(sh.cadeteBase) : cadeteBase();

/* ---------- Estado ---------- */

  menu: [], inv: [], shifts: [], sales: [], settings: {},
  got: {}, fresh: {}, db: null, status: "loading", err: null,

const DEVICE_KEY = "pietra-device";
function deviceSetting() { try { return localStorage.getItem(DEVICE_KEY) || "auto"; } catch (e) { return "auto"; } }

const isPaid = s => s.status !== "pending" && !s.cancelled;
const currentShift = () => S.shifts.find(s => s.status === "open") || null;

// Nombre de categoría limpio (sin espacios de más) y clave para comparar sin mayúsculas, tildes ni espacios.
const cleanCat = c => String(c || "").replace(/\s+/g, " ").trim();
const catKey = c => cleanCat(c).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const sameCat = (a, b) => catKey(a || "Otros") === catKey(b || "Otros");
// Todas las categorías conocidas: las guardadas en la configuración (en su orden) y las que usan los productos.
function allCategories() {
  const out = [], seen = new Set();
  [...(S.settings.categories || []), ...S.menu.map(m => m.category || "Otros")].forEach(c => {
    const name = cleanCat(c), k = catKey(name);
    if (name && !seen.has(k)) { seen.add(k); out.push(name); }
  });
  return out;
}
const canonCat = c => allCategories().find(x => sameCat(x, c)) || cleanCat(c) || "Otros";
// Categorías con productos (para Vender y Menú), en el orden guardado.
function categories(includeAll) {
  const list = includeAll ? S.menu : S.menu.filter(m => m.active !== false);
  const used = allCategories().filter(c => list.some(m => sameCat(m.category, c)));
  const order = (S.settings.categories || []).map(catKey);
  return used.sort((a, b) => {
    const ia = order.indexOf(catKey(a)), ib = order.indexOf(catKey(b));
    if (ia !== ib) return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
    return a.localeCompare(b, "es");
  });
}
// Guarda solo los campos que cambian, para no pisar lo que otro dispositivo cambió en la configuración.
function saveSettings(patch, okMsg) {
  return save(() => S.settingsExists ? S.db.doc("config/settings").update(patch) : S.db.doc("config/settings").set({...S.settings, ...patch}), okMsg);
}
// Agrega una categoría a la lista guardada si no existe (comparando sin mayúsculas, tildes ni espacios).
async function ensureCategory(name) {
  const clean = cleanCat(name);
  const order = S.settings.categories || [];
  if (order.some(c => sameCat(c, clean))) return true;
  const ok = await saveSettings({categories: [...order.map(cleanCat), clean]});
  if (ok) S.settings = {...S.settings, categories: [...order, clean]};
  return ok;
}
const byName = (a, b) => (a.name || "").localeCompare(b.name || "", "es");

// cadeteFijo: monto fijo del turno; si es null (por ejemplo, un día con varios turnos) no se calcula el pago al cadete.
function summarize(sales, opening, cadeteFijo = null) {
  const ok = sales.filter(isPaid);
  const pend = sales.filter(isPending);
  const canc = sales.filter(s => s.cancelled);
  // Envío lejano: se paga una vez por SALIDA del cadete (tripId). Varios pedidos lejanos en la misma salida = un solo extra.
  // Los envíos lejanos sin salida (no asignados por la app) cuentan uno por uno, como antes.
  const farGroups = {};
  sales.filter(s => !s.cancelled && s.far).forEach(s => { const k = s.tripId ? "t:" + s.tripId : "s:" + s.id; farGroups[k] = Math.max(farGroups[k] || 0, Number(s.farFee) || FAR_DEFAULT); });
  const far = Object.values(farGroups).map(fee => ({farFee: fee}));
  const sum = arr => arr.reduce((t, s) => t + (Number(s.total) || 0), 0);
  const prod = {};
  ok.forEach(s => (s.items || []).forEach(it => {
    const k = it.name;
    prod[k] = prod[k] || {name: it.name, qty: 0, total: 0};
    prod[k].qty += it.qty; prod[k].total += it.qty * it.price;
  }));
  const cash = sum(ok.filter(s => s.payment === "efectivo"));
  const pos = sum(ok.filter(s => s.payment === "pos"));
  return {
    count: ok.length, total: sum(ok), cash, pos,
    cashCount: ok.filter(s => s.payment === "efectivo").length,
    posCount: ok.filter(s => s.payment === "pos").length,
    pendingCount: pend.length, pendingTotal: sum(pend),
    cancelledCount: canc.length, cancelledTotal: sum(canc),
    farCount: far.length, farTotal: far.reduce((t, s) => t + (Number(s.farFee) || FAR_DEFAULT), 0),
    // Propina del delivery con tarjeta: un valor por pedido cobrado (tipCard). No cambia total, efectivo ni POS; va al cadete.
    tipCount: ok.filter(s => Number(s.tipCard) > 0).length, tipTotal: ok.reduce((t, s) => t + (Number(s.tipCard) > 0 ? Math.round(Number(s.tipCard)) : 0), 0),
    cadeteBase: cadeteFijo, cadeteTotal: cadeteFijo == null ? null : cadeteFijo + far.reduce((t, s) => t + (Number(s.farFee) || FAR_DEFAULT), 0) + ok.reduce((t, s) => t + (Number(s.tipCard) > 0 ? Math.round(Number(s.tipCard)) : 0), 0),
    products: Object.values(prod).sort((a, b) => b.qty - a.qty || b.total - a.total),
    opening: Number(opening) || 0, expectedCash: (Number(opening) || 0) + cash,
    avg: ok.length ? sum(ok) / ok.length : 0
  };
}

/* ---------- Datos ---------- */
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code: "timeout"}), ms))]);
// Escrituras que necesitan internet (menú, configuración, cierre de turno).
async function save(fn, okMsg) {
  try { await withTimeout(fn(), 15000); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const code = e && e.code;
    if (code === "timeout" || code === "unavailable") { toast("No hay conexión. Este cambio necesita internet: probá cuando vuelva.", "bad"); return false; }
    if (code === "invalid_argument") toast(e.raw === "permission-denied" ? "No se pudo guardar: este usuario no tiene permiso." : "No se pudo guardar. Revisá los datos (por ejemplo, una imagen muy pesada).", "bad");
    else if (code === "quota_exceeded") toast("Se llegó al límite gratuito de Firebase por hoy. Mañana se renueva solo.", "bad");
    else toast("No se pudo guardar. Revisá la conexión e intentá de nuevo.", "bad");
    return false;
  }
}

/* ---------- Cola sin conexión ----------
   Ventas, cobros, tickets, turnos e inventario se guardan primero en este equipo (localStorage) y se mandan a la
   cuenta en orden. Cada operación apunta a un documento con id fijo y escribe su contenido completo o los mismos
   campos, así que reenviarla después de un corte no duplica nada. */
const OUTBOX_KEY = "pietra-outbox-v1";
const OB = {ops: [], failed: [], recent: [], persist: true, flushing: false, inflight: null, net: navigator.onLine !== false, lastTry: 0};
const RAW = {sales: [], shifts: [], inv: [], deliveries: [], kitchen: []};
const PENDING = new Map(); // escrituras ya entregadas a Firebase que esperan conexión
const COLL_KEY = {sales: "sales", shifts: "shifts", inventory: "inv", deliveries: "deliveries", kitchen: "kitchen"};
function obLoad() {
  try { const raw = localStorage.getItem(OUTBOX_KEY); const d = raw ? JSON.parse(raw) : {}; OB.ops = d.ops || []; OB.failed = d.failed || []; }
  catch (e) { OB.persist = false; }
}
function obSave() {
  try { localStorage.setItem(OUTBOX_KEY, JSON.stringify({ops: OB.ops, failed: OB.failed})); OB.persist = true; }
  catch (e) { OB.persist = false; }
}
const newId = coll => S.db ? S.db.collection(coll).doc().id : "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
// Encola una escritura. Si hay una operación anterior del mismo documento que todavía no salió, se combinan.
function queue(op, path, data, label) {
  const waiting = o => o.path === path && o.k !== OB.inflight;
  const prev = [...OB.ops].reverse().find(waiting);
  if (prev && op === "update" && (prev.op === "set" || prev.op === "update")) { prev.data = {...prev.data, ...data}; prev.label = label; prev.at = Date.now(); }
  else if (prev && op === "delete" && prev.op === "set" && !OB.ops.some(o => o.path === path && o.k === OB.inflight) && !RAW[COLL_KEY[path.split("/")[0]]].some(d => d.id === path.split("/")[1])) {
    OB.ops = OB.ops.filter(o => o.path !== path); // se creó y se borró sin conexión: no hace falta mandar nada
  }
  else OB.ops.push({k: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), op, path, data: data || null, label, at: Date.now()});
  obSave(); recompute(); render(); flush();
  return true;
}
async function runOp(o) {
  const ref = S.db.doc(o.path);
  if (o.op === "set") return ref.set(o.data);
  if (o.op === "update") return ref.update(o.data);
  return ref.delete();
}
async function flush() {
  if (OB.flushing || !S.db || !OB.ops.length) return;
  OB.flushing = true; OB.lastTry = Date.now(); renderSync();
  try {
    while (OB.ops.length) {
      const o = OB.ops[0]; OB.inflight = o.k;
      try { if (!PENDING.has(o.k)) PENDING.set(o.k, runOp(o).finally(() => PENDING.delete(o.k))); await withTimeout(PENDING.get(o.k), 15000); }
      catch (e) {
        const code = e && e.code;
        if (code === "invalid_argument" || code === "quota_exceeded" || code === "transform_error") {
          // No se va a poder guardar nunca (por ejemplo, el ticket ya no existe): se aparta para que no trabe el resto.
          OB.ops.shift(); OB.failed.push({...o, code, failedAt: Date.now()}); obSave(); recompute();
          toast(`No se pudo sincronizar: ${o.label}`, "bad"); continue;
        }
        OB.net = false; OB.wasOffline = true; break;
      }
      OB.ops.shift(); OB.recent.push({...o, doneAt: Date.now()}); OB.net = true; obSave(); recompute();
    }
  } finally {
    OB.inflight = null; OB.flushing = false;
    OB.recent = OB.recent.filter(o => Date.now() - o.doneAt < 20000);
    if (!OB.ops.length && OB.wasOffline && OB.net) { OB.wasOffline = false; toast("Volvió la conexión: todo sincronizado"); }
    render();
  }
}
// Lo que muestra la app = lo que vino de la cuenta + los cambios de este equipo que todavía no llegaron.
function overlay(coll, docs) {
  // Solo los cambios de este equipo que todavía no salieron. Los ya enviados no se vuelven a aplicar:
  // Firebase ya los muestra en sus datos, y reaplicarlos taparía cambios hechos después en otro equipo (por ejemplo, el cadete).
  const list = OB.ops.filter(o => o.path.split("/")[0] === coll);
  if (!list.length) return docs;
  const map = new Map(docs.map(d => [d.id, d]));
  list.forEach(o => {
    const id = o.path.split("/")[1];
    if (o.op === "set") map.set(id, {id, ...o.data});
    else if (o.op === "update") { const cur = map.get(id); if (cur) map.set(id, {...cur, ...o.data}); }
    else map.delete(id);
  });
  return [...map.values()];
}
function recompute() { S.sales = overlay("sales", RAW.sales); S.shifts = overlay("shifts", RAW.shifts); S.inv = overlay("inventory", RAW.inv); S.deliveries = overlay("deliveries", RAW.deliveries); S.kitchen = overlay("kitchen", RAW.kitchen); }
function syncState() {
  const n = OB.ops.length;
  if (!OB.net && n) return {cls: "bad", text: S.phone ? `Sin conexión · ${n}` : `Sin conexión · ${plural(n, "cambio sin sincronizar", "cambios sin sincronizar")}`};
  if (!OB.net) return {cls: "bad", text: "Sin conexión"};
  if (n) return {cls: "warn", text: S.phone ? `Sincronizando ${n}…` : `Sincronizando ${plural(n, "cambio", "cambios")}…`};
  if (OB.failed.length) return {cls: "bad", text: plural(OB.failed.length, "cambio no se sincronizó", "cambios no se sincronizaron")};
  return {cls: "ok", text: "Al día"};
}
function renderSync() {
  const el = $("#syncpill"); if (!el) return;
  if (S.status === "loading" || S.status === "nocfg") { el.innerHTML = ""; return; }
  const st = syncState();
  el.innerHTML = `<button class="pill ${st.cls} syncbtn" data-act="sync" title="Ver estado de sincronización">${st.text}</button>`;
}
function openSync() {
  const st = syncState();
  const row = (o, extra) => `<tr><td>${esc(o.label)}</td><td class="muted">${hhmm(o.at)}</td><td class="num">${extra}</td></tr>`;
  openModal("Sincronización", `
    <div class="statusline"><span class="pill ${st.cls}">${st.text}</span></div>
    <p class="hint" style="margin:0">${OB.net
      ? "Los cambios se mandan a tu cuenta apenas se hacen."
      : "No hay internet. Podés seguir vendiendo, cobrando y guardando pedidos: todo queda en este equipo y se manda solo cuando vuelva la conexión. Si cerrás la app, al abrirla de nuevo en este mismo equipo los cambios siguen ahí."}</p>
    ${OB.persist ? "" : `<p class="hint" style="margin:0;color:var(--bad)">Este navegador no deja guardar datos en el equipo: si cerrás la página antes de sincronizar, los cambios pendientes se pierden.</p>`}
    ${OB.ops.length ? `<div class="card"><header><h3>Pendientes</h3></header><div class="tablewrap"><table><tbody>${OB.ops.map(o => row(o, o.k === OB.inflight ? `<span class="pill warn plain">Enviando</span>` : `<span class="pill off plain">En espera</span>`)).join("")}</tbody></table></div></div>` : `<p class="empty" style="padding:12px">No hay cambios pendientes.</p>`}
    ${OB.failed.length ? `<div class="card"><header><h3>No se pudieron sincronizar</h3><span class="muted">Revisalos y cargalos de nuevo si hace falta</span></header><div class="tablewrap"><table><tbody>${OB.failed.map((o, i) => row(o, `<button class="btn sm ghost" data-act="sync-discard" data-i="${i}">Descartar</button>`)).join("")}</tbody></table></div></div>` : ""}
    <div class="actions end"><button class="btn ghost" data-act="close-modal">Cerrar</button><button class="btn primary" data-act="sync-now" ${OB.ops.length ? "" : "disabled"}>Sincronizar ahora</button></div>`, {wide: true});
}

async function init() {
  obLoad(); recompute();
  window.addEventListener("online", () => { OB.net = true; render(); flush(); });
  window.addEventListener("offline", () => { OB.net = false; OB.wasOffline = true; render(); });
  window.addEventListener("beforeunload", e => { if (OB.ops.length) { e.preventDefault(); e.returnValue = ""; } });
  setInterval(() => { if (OB.ops.length && !OB.flushing) flush(); else if (!OB.ops.length && !OB.net && navigator.onLine !== false) { OB.net = true; render(); } }, 7000);
  render();
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    // Cuando se publica una versión nueva, se avisa para cargarla con un toque.
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController) S.updateReady = true; render(); });
    navigator.serviceWorker.register("./sw.js", {updateViaCache: "none"}).then(reg => {
      setInterval(() => reg.update().catch(() => {}), 10 * 60000);
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    }).catch(() => {});
  }
  if (!fbConfigured()) { S.status = "nocfg"; render(); return; }
  await startFirebase();
  AUTH.onAuthStateChanged(u => {
    S.user = u || null;
    if (!u) { showLogin(); return; }
    hideLogin();
    if (!S.db) connectDb();
  });
}

function connectDb() {
  const timer = setTimeout(() => { if (S.status !== "ready") { S.status = "slow"; render(); } }, 10000);
  const db = makeDb(FS);
  S.db = db;
  const keys = ["menu", "inv", "shifts", "sales", "settings", "ticket", "auth", "deliveries", "kitchen"];
  const done = (k, fromCache) => {
    S.got[k] = true; if (!fromCache) S.fresh[k] = true;
    if (keys.every(x => S.got[x]) && S.status === "loading") S.status = "ready";
    if (keys.every(x => S.fresh[x])) { clearTimeout(timer); if (S.status === "slow") S.status = "ready"; }
    render();
  };
  const onErr = e => { clearTimeout(timer); S.status = "error"; S.err = e && e.raw === "permission-denied" ? "permiso" : (e && e.code); render(); };
  const coll = (q, key) => q.onSnapshot(snap => {
    const docs = snap.docs.map(d => ({id: d.id, ...d.data()}));
    if (key in RAW) { RAW[key] = docs; recompute(); } else S[key] = docs;
    if (key === "deliveries") watchDeliveries(snap.metadata.fromCache);
    if (!snap.metadata.fromCache && (key === "sales" || key === "shifts")) S.liveAt = Date.now();
    done(key, snap.metadata.fromCache);
  }, onErr);
  coll(db.collection("menu"), "menu");
  coll(db.collection("inventory"), "inv");
  coll(db.collection("shifts").orderBy("openedAt", "desc").limit(120), "shifts");
  coll(db.collection("sales"), "sales");
  coll(db.collection("deliveries"), "deliveries");
  coll(db.collection("kitchen"), "kitchen");
  db.doc("config/settings").onSnapshot(snap => { S.settings = snap.exists ? {...snap.data()} : {}; S.settingsExists = snap.exists; done("settings", snap.metadata.fromCache); }, onErr);
  db.doc("config/ticket").onSnapshot(snap => { S.ticket = snap.exists ? {...snap.data()} : {}; done("ticket", snap.metadata.fromCache); }, onErr);
  db.doc("config/auth").onSnapshot(snap => { S.auth = snap.exists ? {...snap.data()} : null; done("auth", snap.metadata.fromCache); }, onErr);
  setInterval(() => { if ((S.view === "turno" || S.view === "ventas") && $("#modal").hidden) render(); }, 60000);
  setInterval(checkStale, 30000);
  flush();
}

async function loadShiftSales(id) {
  if (S.histCache[id] || S.histLoading.has(id) || !S.db) return;
  if ((S.histRetry || {})[id] > Date.now()) return;
  S.histLoading.add(id);
  try {
    const snap = await withTimeout(S.db.doc("shiftSales/" + id).get(), 12000);
    S.histCache[id] = snap.exists ? ((snap.data().sales) || []) : [];
  } catch (e) { S.histRetry = {...(S.histRetry || {}), [id]: Date.now() + 30000}; S.histLoading.delete(id); return; }
  S.histLoading.delete(id);
  render();
  const detail = document.getElementById("shift-detail-sales");
  if (detail && detail.dataset.id === id) detail.innerHTML = salesTable(S.histCache[id]);
}

    : `<button class="pill off syncbtn" data-act="printer-connect" title="Tocá para conectar la impresora">${S.printerBusy ? "Conectando…" : "Impresora desconectada"}</button>`;
  $("#tabs").innerHTML = viewsHere().map(([k, l]) => `<button data-act="nav" data-view="${k}" ${S.view === k ? 'aria-current="page"' : ""}>${l}${k === "inventario" && low ? `<span class="dot" aria-label="${low} insumos con stock bajo">${low}</span>` : ""}</button>`).join("");
  const sh = currentShift();

  // La lista de Guardados (si está abierta) se actualiza junto con la pantalla: asignar, quitar, entregar, eliminar.
  if (S.savedRefresh && !$("#modal").hidden) S.savedRefresh();
  if (S.kitchenRefresh && !$("#modal").hidden) S.kitchenRefresh();
  let banner = "";
  if (S.updateReady) banner = `<p class="banner"><span><strong>Hay una versión nueva de la app.</strong> Tocá Actualizar para verla${OB.ops.length ? " (los cambios sin sincronizar se conservan)" : ""}.</span><button class="btn sm primary" data-act="app-update">Actualizar</button></p>`;
  else
  if (S.status !== "loading" && S.status !== "nocfg" && !OB.net) banner = `<p class="banner bad"><span><strong>Sin conexión.</strong> Seguí vendiendo normalmente: ventas, cobros y pedidos se guardan en este equipo y se sincronizan solos cuando vuelva internet.${OB.ops.length ? ` <strong>${plural(OB.ops.length, "cambio pendiente", "cambios pendientes")}.</strong>` : ""}</span><button class="btn sm" data-act="sync">Ver detalle</button></p>`;
  else if (S.status === "slow") banner = `<p class="banner">No se puede llegar a la base de datos todavía. Lo que ves puede estar desactualizado; la app sigue intentando.</p>`;
  else if (S.status === "error") banner = S.err === "permiso"
    ? `<p class="banner bad"><span>Este usuario (${esc(S.user && S.user.email)}) no tiene acceso a la caja. <strong>Si sos el cadete, usá <a href="cadete/">la página de envíos</a>.</strong> Si sos el dueño, revisá las reglas de Firestore.</span><button class="btn sm" data-act="logout">Cambiar de usuario</button></p>`
    : `<p class="banner bad">Se perdió la conexión con los datos (${esc(S.err || "error")}). Recargá la página para reconectar.</p>`;
  else if (S.status === "ready" && S.settings.example && (S.view === "vender" || S.view === "menu" || S.view === "inventario"))
    banner = `<p class="banner"><span>El menú y el inventario son de <strong>ejemplo</strong>. Cargá tus productos y precios reales en <strong>Menú</strong> y tus insumos en <strong>Inventario</strong>.</span><button class="btn sm" data-act="dismiss-example">Entendido</button></p>`;
  $("#banner").innerHTML = banner;

  if (S.status === "loading") main.innerHTML = `<div class="page"><p class="muted">Cargando la caja…</p></div>`;
  else if (S.status === "nocfg") main.innerHTML = `<div class="page"><div class="locked"><h3>Falta conectar Firebase</h3><p class="hint">Esta copia de la app no tiene cargada la configuración de Firebase (FIREBASE_CONFIG en index.html).</p></div></div>`;
  else if (S.view === "config") {
    // La configuración se dibuja una vez al entrar, para que los datos que llegan no borren lo que estás escribiendo.
    if (!S.cfgRendered || !main.querySelector("[data-cfg]")) { main.innerHTML = viewConfig(); mountConfig(); S.cfgRendered = true; }
    return;
  }
  else if (S.view === "turno" && patchShiftView(main)) { /* solo se actualizaron totales y tablas; las notas siguen intactas */ }
  else main.innerHTML = ({vender: viewSell, ventas: viewSales, turno: viewShift, inventario: viewInv, menu: viewMenu})[S.view]();

  const cat = main.querySelector(".catalog"); if (cat) cat.scrollTop = scroll; else main.scrollTop = scroll;
  if (keepId) { const n = document.getElementById(keepId); if (n) { n.focus(); if (sel) try { n.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}

function itemsText(items) { return (items || []).map(it => `${it.qty}× ${esc(it.name)}`).join(", "); }

function viewSell() {
  const sh = currentShift();
  // Si el ticket que se estaba editando se cobró o anuló desde otro lado, salir del modo edición.
  if (S.editId && S.status === "ready" && !isPending(editingSale() || {})) { S.editId = null; S.cart = []; S.note = ""; S.far = false; }
  const editing = editingSale();
  const cats = categories();
  if (S.cat && !cats.some(c => sameCat(c, S.cat))) S.cat = null;
  const inCart = {}; S.cart.forEach(l => inCart[l.id] = l.qty);
  const prodBtn = m => `<button class="prod ${inCart[m.id] ? "in" : ""} ${m.img ? "has-img" : ""}" data-act="add" data-id="${m.id}" ${sh ? "" : "disabled"}>
      ${inCart[m.id] ? `<span class="q">${inCart[m.id]}</span>` : ""}
      ${m.img ? `<img class="img" src="${esc(m.img)}" alt="">` : ""}
      <span class="${m.img ? "txt" : ""}" style="${m.img ? "" : "display:contents"}"><span class="n">${esc(m.name)}</span><span class="p">${fmt(m.price)}</span></span>
    </button>`;
  const active = S.menu.filter(m => m.active !== false);
  const pendN = pendingTickets().length;
  const toolbar = `<div class="toolbar">
      <label class="search"><input id="q" type="search" placeholder="Buscar producto…" value="${esc(S.q)}" aria-label="Buscar producto" autocomplete="off"></label>
      ${(() => { const late = pendingTickets().filter(isStale).length; return `<button class="savedbtn ${pendN ? "" : "zero"} ${late ? "late" : ""}" data-act="saved" ${late ? `aria-label="Guardados: ${pendN}, ${late} con más de ${STALE_MIN} minutos sin cobrar"` : ""}>Guardados <span class="n">${pendN}</span>${late ? `<span class="late-tag"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"></circle><path d="M8 4.6V8l2.4 1.6"></path></svg>${late} +${STALE_MIN} min</span>` : ""}<kbd class="kbd-hint">F8</kbd></button>`; })()}
      ${(() => { const t = openTripId(); if (!t) return ""; const n = tripOpen().filter(d => d.tripId === t).length; return `<button class="tripbtn" data-act="trip-back" title="El cadete está en una salida. Tocá cuando vuelva (se cierra sola al cobrar sus pedidos).">Cadete en salida · ${n} <span>Volvió</span></button>`; })()}
      ${(() => { const n = kitchenCooking().length; return `<button class="kitchenbtn ${n ? "" : "zero"}" data-act="kitchen" title="Pedidos en preparación">Cocina <span class="n">${n}</span><kbd class="kbd-hint">F9</kbd></button>`; })()}
    </div>`;
  let catalog;
  if (!sh) {
    catalog = `<div class="locked"><h3>Abrí el turno para empezar a vender</h3><p class="hint">Indicá con cuánto efectivo arranca la caja. Al cerrar el turno vas a ver el detalle de todas las ventas.</p>
      <label class="field" style="width:220px"><span>Fondo de caja inicial ($)</span><input id="opencash" type="number" min="0" step="1" inputmode="numeric" value="${esc(S.openCash)}" placeholder="0"></label>
      <button class="btn primary lg" data-act="open-shift">Abrir turno</button></div>`;
  } else if (!active.length) {
    catalog = `${toolbar}<div class="locked"><h3>Todavía no hay productos</h3><p class="hint">Cargá tu menú con precios para poder vender.</p><button class="btn primary" data-act="nav" data-view="menu">Ir a Menú</button></div>`;
  } else if (S.q.trim()) {
    const res = searchResults();
    catalog = `${toolbar}<section class="catgroup"><h3>${res.length ? plural(res.length, "resultado", "resultados") + " · Enter agrega el primero" : "Sin resultados"}</h3><div class="grid">${res.map(prodBtn).join("")}</div></section>`;
  } else {
    const shown = S.cat ? cats.filter(c => sameCat(c, S.cat)) : cats;
    catalog = `${toolbar}<div class="cats" role="group" aria-label="Categorías">
        <button data-act="cat" data-cat="" aria-pressed="${!S.cat}">Todo</button>
        ${cats.map(c => `<button data-act="cat" data-cat="${esc(c)}" aria-pressed="${!!S.cat && sameCat(S.cat, c)}">${esc(c)}</button>`).join("")}
      </div>
      ${shown.map(c => `<section class="catgroup"><h3>${esc(c)}</h3><div class="grid">${active.filter(m => sameCat(m.category, c)).sort(byName).map(prodBtn).join("")}</div></section>`).join("")}`;
  }

  const can = S.cart.length && sh;
  const lines = S.cart.length ? S.cart.map((l, i) => `<div class="line" data-id="${esc(l.id)}">
      <div><div class="nm">${esc(l.name)}</div><div class="up">${fmt(l.price)} c/u</div></div>
      <div class="stepper"><button data-act="dec" data-i="${i}" aria-label="Quitar uno de ${esc(l.name)}">−</button><span>${l.qty}</span><button data-act="inc" data-i="${i}" aria-label="Agregar uno de ${esc(l.name)}">+</button></div>
      <div class="st">${fmt(l.price * l.qty)}</div></div>`).join("")
    : `<p class="empty">${editing ? "El ticket quedó vacío. Agregá productos o eliminalo." : "Tocá los productos del menú para armar el pedido."}</p>`;

    : `<div class="paybtns">
          <button class="btn primary" data-act="charge-cart" ${can ? "" : "disabled"}>Cobrar ahora<kbd class="kbd-hint">F2</kbd></button>
          <button class="btn dark" data-act="hold" ${can ? "" : "disabled"}>Guardar ticket<kbd class="kbd-hint">F4</kbd></button>

  return `<div class="sell">
    <div class="catalog">${catalog}
      <div class="shortcuts" aria-hidden="true"><span><kbd>/</kbd> buscar</span><span><kbd>Enter</kbd> agregar el primero</span><span><kbd>F2</kbd> cobrar</span><span><kbd>F4</kbd> guardar ticket</span><span><kbd>F8</kbd> guardados</span><span><kbd>F9</kbd> cocina</span><span><kbd>Esc</kbd> cerrar</span></div>

      ${head}
      <div class="lines">${lines}</div>
      <div class="tfoot">
        <div class="seg two-opt compact" role="radiogroup" aria-label="Tipo de pedido">
          <label><input type="radio" name="omode" value="retiro" ${S.mode !== "envio" ? "checked" : ""}>Retiro</label>

        ${S.mode === "envio" ? `<label class="field"><span>Dirección o ubicación</span><input class="text" id="addr" placeholder="Pegá la dirección o el enlace de ubicación de WhatsApp" value="${esc(S.addr)}" autocomplete="off"></label>
        <div id="addr-info" class="locinfo" aria-live="polite">${locInfoHtml(S.addr)}</div>
        <label class="farbox"><input type="checkbox" id="far" ${S.far ? "checked" : ""}> +${farFee()} envío lejano <small>Para el cadete, no se cobra</small></label>` : ""}
        <label class="field"><span>Nota del pedido</span><textarea class="text" id="onote" rows="2" placeholder="Ej.: sin cebolla, bien cocida, cortada en 8">${esc(S.onote)}</textarea></label>
        <div class="total"><span>Total</span><strong>${fmt(total)}</strong></div>

function searchResults() {
  const q = norm(S.q.trim());
  return S.menu.filter(m => m.active !== false && norm(m.name).includes(q)).sort((a, b) => {
    const sa = norm(a.name).startsWith(q) ? 0 : 1, sb = norm(b.name).startsWith(q) ? 0 : 1;
    return sa - sb || byName(a, b);
  });
}

function payPill(s) {
  if (s.cancelled) return `<span class="pill bad plain">Anulada</span>`;
  if (s.status === "pending") return isStale(s) ? `<span class="pill bad plain" title="Lleva ${ageText(s)} sin cobrar">Por cobrar · ${ageText(s)}</span>` : `<span class="pill warn plain">Por cobrar</span>`;
  return `<span class="pill ${s.payment === "pos" ? "off" : "ok"} plain">${PAY[s.payment] || esc(s.payment)}</span>${Number(s.tipCard) > 0 ? ` <span class="pill tip plain" title="Propina del delivery con tarjeta, para el cadete">Propina ${fmt(s.tipCard)}</span>` : ""}`;
}
function salesTable(sales) {
  // Las acciones (Cobrar, Anular) solo aparecen para ventas del turno abierto.
  if (!sales.length) return `<p class="empty">No hay ventas.</p>`;
  const sh = currentShift();
  const act = s => sh && s.shiftId === sh.id && !s.cancelled;
  const tk = s => !s.cancelled;
  const any = sales.some(s => act(s) || tk(s));
  if (S.phone) return `<div class="mlist">${sales.map(s => `<div class="mrow ${s.cancelled ? "cancel" : ""}" ${tk(s) ? `data-act="ticket-view" data-id="${s.id}" role="button" tabindex="0"` : ""}>
      <div class="mr-top"><strong>#${s.num ?? ""}</strong><span class="muted">${hhmm(s.createdAt)}</span>${payPill(s)}${kitchenBadge(s)}${deliveryBadge(s)}${s.far && !s.cancelled ? `<span class="pill warn plain">+${s.farFee || farFee()}</span>` : ""}<span class="sp"></span><span class="amt">${fmt(s.total)}</span></div>
      ${s.note ? `<strong>${esc(s.note)}</strong>` : ""}
      <div class="mr-sub">${itemsText(s.items)}</div>
      ${orderMeta(s) ? `<div>${orderMeta(s, {inline: true})}</div>` : ""}
    </div>`).join("")}</div>`;
  return `<div class="tablewrap"><table><thead><tr><th>#</th><th>Hora</th><th>Pedido</th><th>Pago</th><th class="num">Total</th>${any ? "<th></th>" : ""}</tr></thead><tbody>
    ${sales.map(s => `<tr class="${s.cancelled ? "cancel" : ""}">
      <td>${s.num ?? ""}</td><td>${hhmm(s.createdAt)}</td>
      <td class="items-sum">${itemsText(s.items)}${s.note ? `<br><strong>${esc(s.note)}</strong>` : ""}${orderMeta(s)}</td>
      <td class="keep">${payPill(s)}${s.far && !s.cancelled ? ` <span class="pill warn plain" title="Envío lejano">+${s.farFee || farFee()}</span>` : ""} ${kitchenBadge(s)} ${deliveryBadge(s)}</td>
      <td class="num">${fmt(s.total)}</td>
      ${any ? `<td class="num keep">${kitchenButtons(s)}${deliveryButtons(s)} ${tk(s) ? `<button class="btn sm ghost" data-act="ticket-view" data-id="${s.id}">Ticket</button> ` : ""}${act(s) ? `${s.status === "pending" ? `<button class="btn sm" data-act="open-ticket" data-id="${s.id}">Abrir</button> <button class="btn sm primary" data-act="charge" data-id="${s.id}">Cobrar</button> ` : ""}<button class="btn sm ghost" data-act="cancel-sale" data-id="${s.id}">Anular</button>` : ""}</td>` : ""}
    </tr>`).join("")}</tbody></table></div>`;
}

function tilesHtml(sum, withCash) {
  const farCount = sum.farCount || 0, farTotal = sum.farTotal || 0;
  return `<div class="tiles">
    <div class="tile hl"><span>Total cobrado</span><strong>${fmt(sum.total)}</strong><small>${plural(sum.count, "venta", "ventas")}${sum.count ? " · promedio " + fmt(sum.avg) : ""}</small></div>
    <div class="tile"><span>Efectivo</span><strong>${fmt(sum.cash)}</strong><small>${plural(sum.cashCount, "venta", "ventas")}</small></div>
    <div class="tile"><span>POS</span><strong>${fmt(sum.pos)}</strong><small>${plural(sum.posCount, "venta", "ventas")}</small></div>
    ${sum.pendingCount ? `<div class="tile"><span>Por cobrar</span><strong>${fmt(sum.pendingTotal)}</strong><small>${plural(sum.pendingCount, "ticket guardado", "tickets guardados")}</small></div>` : ""}
    ${withCash ? `<div class="tile"><span>Efectivo esperado en caja</span><strong>${fmt(sum.expectedCash)}</strong><small>Fondo ${fmt(sum.opening)} + efectivo</small></div>` : ""}
    ${sum.cadeteTotal != null ? `<div class="tile cadete"><span>Pagar al cadete</span><strong>${fmt(sum.cadeteTotal)}</strong><small>Fijo ${fmt(sum.cadeteBase)} + ${plural(farCount, "salida lejana", "salidas lejanas")} (${fmt(farTotal)})${sum.tipTotal ? ` + ${plural(sum.tipCount, "propina", "propinas")} con tarjeta (${fmt(sum.tipTotal)})` : ""} · aparte de las ventas</small></div>`
      : farCount || sum.tipTotal ? `<div class="tile cadete"><span>Para el cadete</span><strong>${fmt(farTotal + (sum.tipTotal || 0))}</strong><small>${plural(farCount, "salida lejana", "salidas lejanas")} (${fmt(farTotal)})${sum.tipTotal ? ` + ${plural(sum.tipCount, "propina", "propinas")} con tarjeta (${fmt(sum.tipTotal)})` : ""} · aparte de las ventas</small></div>` : ""}
    ${sum.cancelledCount ? `<div class="tile"><span>Anuladas</span><strong>${sum.cancelledCount}</strong><small>${fmt(sum.cancelledTotal)} no cobrados</small></div>` : ""}
  </div>`;
}

// Desglose del pago al cadete: fijo, envíos lejanos, propinas con tarjeta y total.
function cadeteBreakdownHtml(sum, sh) {
  const base = sum.cadeteBase != null ? sum.cadeteBase : shiftCadeteBase(sh);
  const total = sum.cadeteTotal != null ? sum.cadeteTotal : base + (sum.farTotal || 0) + (sum.tipTotal || 0);
  return `<div class="card"><header><h3>Pago al cadete</h3><span class="muted">Aparte de las ventas: no suma ni resta del total</span></header>
    <div class="tablewrap"><table><tbody>
      <tr><td>Monto fijo del turno</td><td class="num">${fmt(base)}</td></tr>
      <tr><td>Salidas lejanas (${sum.farCount || 0} × ${fmt(farFee())}) · varios pedidos lejanos en la misma salida pagan una vez</td><td class="num">${fmt(sum.farTotal)}</td></tr>
      <tr><td>Propinas del delivery con tarjeta (${sum.tipCount || 0})</td><td class="num">${fmt(sum.tipTotal || 0)}</td></tr>
      <tr class="totrow"><td><strong>Total a pagar al cadete</strong></td><td class="num"><strong>${fmt(total)}</strong></td></tr>
    </tbody></table></div></div>`;
}
function productsTable(products) {
  if (!products.length) return `<p class="empty">Sin productos vendidos.</p>`;
  return `<div class="tablewrap"><table><thead><tr><th>Producto</th><th class="num">Cant.</th><th class="num">Importe</th></tr></thead><tbody>
    ${products.map(p => `<tr><td>${esc(p.name)}</td><td class="num">${p.qty}</td><td class="num">${fmt(p.total)}</td></tr>`).join("")}</tbody></table></div>`;
}

// Una venta cuenta en el día en que se cobró (o en que se tomó, si todavía no se cobró).
const saleTime = s => s.paidAt || s.createdAt;
const dayRange = key => { const [y, m, d] = key.split("-").map(Number); const a = new Date(y, m - 1, d).getTime(); return [a, new Date(y, m - 1, d + 1).getTime()]; };
// Ventas de un día, de la MISMA fuente que usa Turno: las del turno abierto (en vivo) + las archivadas de turnos cerrados.
// Un turno puede abrir un día y cerrar al siguiente, así que se miran todos los turnos que tocan ese día.
function salesForDay(key) {
  const [from, to] = dayRange(key);
  const touching = S.shifts.filter(sh => sh.openedAt < to && (sh.status === "open" || (sh.closedAt || Date.now()) >= from));
  const byId = new Map();
  let loading = false;
  touching.filter(sh => sh.status !== "open").forEach(sh => {
    if (S.histCache[sh.id]) S.histCache[sh.id].forEach(x => byId.set(x.id, x));
    else { loading = true; loadShiftSales(sh.id); }
  });
  S.sales.forEach(x => byId.set(x.id, x)); // lo que está en vivo gana sobre lo archivado
  const sales = [...byId.values()].filter(x => { const t = saleTime(x); return t >= from && t < to; });
  return {sales, shifts: touching, loading};
}

function viewSales() {
  const today = dayKey(Date.now());
  if (!S.histPinned) S.histDate = today; // sin fecha elegida, Ventas siempre muestra hoy (también después de medianoche)
  const date = S.histDate;
  const {sales, shifts, loading} = salesForDay(date);
  sales.sort((a, b) => saleTime(b) - saleTime(a));
  const sum = summarize(sales, 0);
  const isToday = date === today;
  return `<div class="page">
    <div class="page-head"><h2>Ventas</h2><span class="spacer"></span>
      <div class="datebar">
        <button class="btn sm" data-act="day" data-d="-1" aria-label="Día anterior">‹ Anterior</button>
        <input type="date" id="histdate" value="${date}" max="${today}" aria-label="Elegir día">
        <button class="btn sm" data-act="day" data-d="1" ${isToday ? "disabled" : ""} aria-label="Día siguiente">Siguiente ›</button>
        ${isToday ? "" : `<button class="btn sm ghost" data-act="today">Hoy</button>`}
      </div></div>
    <p class="muted" style="margin:0">${longDate(date)} · ${shifts.length ? plural(shifts.length, "turno", "turnos") : "sin turnos"}${S.liveAt ? ` · actualizado ${new Date(S.liveAt).toLocaleTimeString("es-UY", {hour: "2-digit", minute: "2-digit", second: "2-digit"})}` : ""}</p>
    ${tilesHtml(sum, false)}
    <div class="card"><header><h3>Detalle de ventas</h3>${loading ? `<span class="muted">Cargando turnos cerrados…</span>` : ""}</header>
      ${sales.length ? salesTable(sales) : `<p class="empty">No hay ventas para este día.</p>`}</div>
  </div>`;
}

// La pantalla de Turno se arma en tres partes. Las notas nunca se vuelven a crear mientras el turno sigue
// abierto: cuando llegan datos nuevos solo se actualizan los totales y las tablas (patchShiftView).
function viewShift() {
  const p = shiftParts();
  return `<div class="page"><div id="tz-top" class="tz">${p.top}</div>${p.notes ? `<div id="tz-notes" data-shift="${p.shiftId}">${p.notes}</div>` : ""}<div id="tz-rest" class="tz">${p.rest}</div></div>`;
}
function patchShiftView(main) {
  const box = main.querySelector("#tz-notes"), top = main.querySelector("#tz-top"), rest = main.querySelector("#tz-rest");
  const p = shiftParts();
  if (!box || !top || !rest || !p.shiftId || box.dataset.shift !== p.shiftId) return false;
  top.innerHTML = p.top; rest.innerHTML = p.rest;
  // Si las notas cambiaron desde otro equipo y acá no se está escribiendo, se actualiza el texto sin tocar el campo.
  const ta = box.querySelector("#shiftnotes"), sh = currentShift();
  if (ta && sh && document.activeElement !== ta && S.notesDraft == null && ta.value !== (sh.notes || "")) ta.value = sh.notes || "";
  return true;
}
function shiftParts() {
  const sh = currentShift();
  const closed = S.shifts.filter(s => s.status === "closed").sort((a, b) => b.openedAt - a.openedAt);
  let top, notes = "", rest = "";
  if (sh) {
    const sales = shiftSales(sh.id);

      <div class="mr-top"><strong>${shortDate(s.openedAt)}</strong><span class="muted">${hhmm(s.openedAt)} a ${s.closedAt ? hhmm(s.closedAt) : "?"}</span><span class="sp"></span><span class="amt">${fmt(m.total)}</span></div>
      <div class="mr-sub">${plural(m.count ?? 0, "venta", "ventas")} · Efectivo ${fmt(m.cash)} · POS ${fmt(m.pos)}${(m.cadeteTotal ?? m.farTotal) ? ` · Cadete ${fmt(m.cadeteTotal ?? m.farTotal)}` : ""}</div>
    </div>`; }).join("")}</div>`
    : closed.length ? `<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Horario</th><th class="num">Ventas</th><th class="num">Efectivo</th><th class="num">POS</th><th class="num">Cadete</th><th class="num">Total</th></tr></thead><tbody>
      ${closed.map(s => { const m = s.summary || {}; return `<tr class="click" data-act="shift-detail" data-id="${s.id}" tabindex="0">
        <td>${shortDate(s.openedAt)}</td><td>${hhmm(s.openedAt)} a ${s.closedAt ? hhmm(s.closedAt) : "?"}</td>

      </tbody></table></div>` : `<p class="empty">Todavía no cerraste ningún turno.</p>`;
  rest += `<div class="card"><header><h3>Turnos cerrados</h3><span class="muted">Tocá uno para ver el cierre detallado</span></header>${hist}</div>`;

// Cada 30 s: avisa una sola vez por ticket cuando pasa los 30 minutos y refresca la lista y el botón de Guardados.
const staleWarned = new Set();
function checkStale() {
  if (S.status !== "ready" && S.status !== "slow") return;
  const late = pendingTickets().filter(isStale);
  const fresh = late.filter(s => !staleWarned.has(s.id));
  fresh.forEach(s => staleWarned.add(s.id));
  if (fresh.length && !S.phone) {
    toast(fresh.length === 1 ? `Ticket #${fresh[0].num}${fresh[0].note ? " de " + fresh[0].note : ""} lleva ${ageText(fresh[0])} sin cobrar` : `${fresh.length} tickets llevan más de ${STALE_MIN} minutos sin cobrar`, "warn");
    fxLater(() => fx(document.querySelector(".savedbtn"), "fx-bump"));
  }
  if (S.savedRefresh) S.savedRefresh();
  else if (S.view === "vender" && $("#modal").hidden) { const b = document.querySelector(".savedbtn"); if (b) render(); }
}

/* ---------- Envíos del cadete ----------
   Cada envío asignado es una ficha en "deliveries" (mismo id que la venta) con lo justo para el cadete:
   cliente, ubicación, nota, productos sin precios, total y si hay que cobrar. Las reglas de Firestore le
   dejan leer solo sus fichas y cambiar solo el estado (entregado) y cómo cobró. */
const deliveryCity = () => (S.settings.deliveryCity ?? "Ciudad del Plata, San José").trim();
const cadeteEmail = () => String(S.settings.cadeteEmail || "").trim().toLowerCase();
const deliveryOf = id => (S.deliveries || []).find(d => d.id === id) || null;
/* ---------- Zona de envíos ----------
   settings.zone = [{lat, lng}, …]: borde de la zona NORMAL dibujado en Configuración. Fuera de la zona = envío lejano. */
const deliveryZone = () => { const z = S.settings.zone; return Array.isArray(z) && z.length >= 3 ? z : null; };
function pointInZone(lat, lng, zone) {
  let inside = false;
  for (let i = 0, j = zone.length - 1; i < zone.length; j = i++) {
    const a = zone[i], b = zone[j];
    if ((a.lat > lat) !== (b.lat > lat) && lng < (b.lng - a.lng) * (lat - a.lat) / (b.lat - a.lat) + a.lng) inside = !inside;
  }
  return inside;
}
// true = dentro de la zona normal, false = fuera (lejano), null = no se puede saber (sin zona o sin punto exacto).
function zoneCheck(raw) {
  const z = deliveryZone(); if (!z || !String(raw || "").trim()) return null;
  const L = Ubicacion.parse(raw, deliveryCity());
  return L.kind === "coords" ? pointInZone(L.lat, L.lng, z) : null;
}
// Marca o desmarca solo el envío lejano según la zona, salvo que se haya tocado a mano en este pedido.
function autoFar() {
  if (S.mode !== "envio" || S.farManual) return;
  const r = zoneCheck(S.addr); if (r === null) return;
  S.far = !r; const box = $("#far"); if (box) box.checked = S.far;
}
function locInfoHtml(raw) {
  if (!String(raw || "").trim()) return `<span class="muted">Ej.: Calle 5 1234 · un enlace de Google Maps · la ubicación que mandó el cliente por WhatsApp</span>`;
  const L = Ubicacion.parse(raw, deliveryCity()), d = Ubicacion.describe(L), w = Ubicacion.wazeUrl(L), m = Ubicacion.mapsUrl(L);
  const z = deliveryZone(), r = zoneCheck(raw);
  const zone = !z ? "" : r === true ? ` <span class="pill ok plain">Dentro de la zona</span>` : r === false ? ` <span class="pill warn plain">Fuera de la zona → envío lejano</span>`
    : ` <span class="muted">· Zona: no se puede calcular sin un punto exacto; marcá el envío lejano a mano si corresponde.</span>`;
  return `<span class="pill ${d.ok ? "ok" : "warn"} plain">${esc(d.label)}</span> <span class="muted">${esc(d.detail)}</span>${zone}
    <span class="loclinks">${w ? `<a href="${esc(w)}" target="_blank" rel="noopener">Probar en Waze</a>` : ""}${m ? `<a href="${esc(m)}" target="_blank" rel="noopener">Ver en Maps</a>` : ""}</span>`;
}
function deliveryFields(sale) {
  const paid = sale.status !== "pending";
  return {
    saleId: sale.id, shiftId: sale.shiftId, num: sale.num ?? null, name: sale.note || "",
    loc: Ubicacion.parse(sale.address || "", deliveryCity()), note: sale.orderNote || "",
    items: (sale.items || []).map(it => ({qty: it.qty, name: it.name})), total: sale.total,
    pay: paid ? {status: "paid", method: sale.payment || null} : {status: "pending"}
  };
}
/* Salidas del cadete: todo lo que se le asigna mientras tiene una salida abierta va en esa salida (tripId).
   La salida se cierra sola cuando la caja cobra todo lo que había que cobrar (los ya pagados se le borran también),
   o con "Volvió el cadete". El cadete no marca nada: ve sus envíos y se le borran cuando la caja los cobra. */
const cadeteDeliveries = () => { const e = cadeteEmail(); return (S.deliveries || []).filter(d => d.cadete === e); };
const tripOpen = () => cadeteDeliveries().filter(d => d.tripId && !d.tripClosed);
function openTripId() { const o = tripOpen().sort((a, b) => (b.assignedAt || 0) - (a.assignedAt || 0)); return o.length ? o[0].tripId : null; }
function assignDelivery(id) {
  const s = S.sales.find(x => x.id === id); if (!s || s.cancelled) return;
  const email = cadeteEmail();
  if (!email) { toast("Primero cargá el correo del cadete en Configuración → Cadete.", "bad"); return; }
  if (!String(s.address || "").trim()) { toast("El pedido no tiene dirección o ubicación. Abrilo y pegala antes de asignarlo.", "bad"); return; }
  const open = openTripId(), tripId = open || "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const others = open ? tripOpen().filter(d => d.tripId === open && d.id !== id).length : 0;
  queue("set", "deliveries/" + id, {...deliveryFields(s), cadete: email, status: "asignado", tripId, tripClosed: false, assignedAt: Date.now()}, `Envío #${s.num} asignado al cadete`);
  queue("update", "sales/" + id, {tripId}, `Envío #${s.num}: salida del cadete`);
  toast(`Pedido #${s.num} asignado al cadete · ${others ? `misma salida que ${others === 1 ? "otro pedido" : others + " pedidos"}` : "salida nueva"}`);
}
function unassignDelivery(id) {
  const d = deliveryOf(id); if (!d) return;
  queue("delete", "deliveries/" + id, null, `Envío #${d.num} sin asignar`);
  queue("update", "sales/" + id, {tripId: null}, `Envío #${d.num} sin salida`);
  toast("Se quitó la asignación");
}
// Cuando no queda nada por cobrar en la salida, el cadete volvió: se le borran también los que ya estaban pagos.
function closeTripIfDone(tripId, exceptId) {
  if (!tripId) return;
  const rest = (S.deliveries || []).filter(d => d.tripId === tripId && d.id !== exceptId);
  if (rest.length && rest.every(d => d.pay && d.pay.status === "paid")) rest.forEach(d => queue("delete", "deliveries/" + d.id, null, `Envío #${d.num} terminado`));
}
// "Volvió el cadete": cierra la salida abierta. Los pagados se le borran; los que faltan cobrar quedan en la caja (y se le ocultan).
function tripBack() {
  const open = openTripId(); if (!open) return;
  const list = tripOpen().filter(d => d.tripId === open);
  list.forEach(d => { if (d.pay && d.pay.status === "paid") queue("delete", "deliveries/" + d.id, null, `Envío #${d.num} terminado`);
    else queue("update", "deliveries/" + d.id, {tripClosed: true}, `Envío #${d.num}: el cadete volvió`); });
  const unpaid = list.filter(d => !(d.pay && d.pay.status === "paid")).length;
  toast(`Salida terminada${unpaid ? ` · quedan ${unpaid} por cobrar en Guardados` : ""}. Lo próximo que asignes es una salida nueva.`);
}
function openTripBack() {
  const open = openTripId(); if (!open) return;
  const list = tripOpen().filter(d => d.tripId === open);
  openModal("¿Volvió el cadete?", `<p class="hint" style="margin:0">Cierra la salida actual: se le borran los envíos de su pantalla y lo próximo que asignes cuenta como una salida nueva. Normalmente no hace falta: la salida se cierra sola cuando cobrás todos sus pedidos.</p>
    <ul>${list.map(d => `<li>#${d.num ?? ""} ${esc(d.name || "")} · ${d.pay && d.pay.status === "paid" ? "ya pagado" : "falta cobrar " + fmt(d.total)}</li>`).join("")}</ul>
    <div class="actions end"><button class="btn ghost" data-act="close-modal">Cancelar</button><button class="btn primary" id="tbok">Sí, volvió</button></div>`,
    {onMount: d => d.querySelector("#tbok").onclick = () => { closeModal(); tripBack(); }});
}
// Mantiene la ficha al día si el pedido cambia; al cobrarlo en la caja se le borra al cadete.
function syncDelivery(sale, removed = false, charged = false) {
  if (!sale || !sale.id) return;
  const d = deliveryOf(sale.id); if (!d) return;
  if (removed || sale.cancelled) { queue("delete", "deliveries/" + sale.id, null, `Envío #${d.num} quitado`); queue("update", "sales/" + sale.id, {tripId: null}, `Envío #${d.num} sin salida`); return; }
  if (sale.mode !== "envio") { queue("delete", "deliveries/" + sale.id, null, `Envío #${d.num} quitado`); queue("update", "sales/" + sale.id, {tripId: null}, `Envío #${d.num} sin salida`); return; }
  if (charged) { queue("delete", "deliveries/" + sale.id, null, `Envío #${d.num} cobrado`); closeTripIfDone(d.tripId, sale.id); return; }
  queue("update", "deliveries/" + sale.id, deliveryFields(sale), `Envío #${d.num} actualizado`);
}
// (Compatibilidad: versiones anteriores dejaban que el cadete marcara "entregado". Ya no se usa.)
function watchDeliveries() {}
function deliveryBadge(s) {
  if (!s || s.mode !== "envio" || s.cancelled) return "";
  const d = deliveryOf(s.id);
  if (d && !d.tripClosed) return `<span class="pill envio plain">Con el cadete</span>`;
  if (d) return `<span class="pill plain">Volvió · falta cobrar</span>`;
  if (s.tripId || s.deliveredAt) return `<span class="pill ok plain">Entregado</span>`;
  return "";
}
function deliveryButtons(s, short = false) {
  if (!s || s.mode !== "envio" || s.cancelled || S.phone) return "";
  const sh = currentShift(); if (!sh || s.shiftId !== sh.id) return "";
  const d = deliveryOf(s.id);
  if (!d && !s.tripId && !s.deliveredAt) return `<button class="btn sm dark" data-act="assign" data-id="${s.id}" title="Asignar al cadete">${short ? "Asignar" : "Asignar al cadete"}</button>`;
  if (d && !d.tripClosed) return `<button class="btn sm ghost" data-act="unassign" data-id="${s.id}" title="Quitar asignación">${short ? "Quitar" : "Quitar asignación"}</button>`;
  return "";
}

/* ---------- Pantalla de cocina ----------
   Cada pedido (guardado o cobrado en el momento) se copia a kitchen/{saleId} con lo justo para cocinar:
   número, nombre, Retiro/Envío, productos con cantidad y nota. Sin precios. La cocina solo lo muestra;
   "Listo" se marca acá en la caja y el pedido sale de la pantalla de cocina. */
const kitchenOf = id => (S.kitchen || []).find(k => k.id === id);
const kitchenCooking = () => (S.kitchen || []).filter(k => k.status === "cocinando").sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
function kitchenFields(s) {
  return {saleId: s.id, shiftId: s.shiftId || null, num: s.num ?? null, name: s.note || "", mode: s.mode === "envio" ? "envio" : "retiro",
    note: s.orderNote || "", items: (s.items || []).map(it => ({qty: it.qty, name: it.name}))};
}
function sendToKitchen(s) {
  if (!s || !s.id || kitchenOf(s.id)) return;
  const now = Date.now();
  queue("set", "kitchen/" + s.id, {...kitchenFields(s), status: "cocinando", createdAt: s.createdAt || now, updatedAt: now, modified: false, readyAt: null}, `Pedido #${s.num} a cocina`);
}
function syncKitchen(sale, removed = false) {
  const k = kitchenOf(sale.id); if (!k) return;
  if (removed || sale.cancelled) { if (k.status !== "anulado") queue("update", "kitchen/" + sale.id, {status: "anulado", updatedAt: Date.now()}, `Pedido #${k.num} sacado de cocina`); return; }
  if (k.status === "anulado") return;
  const f = kitchenFields(sale);
  const cook = x => JSON.stringify([x.items, x.note]);
  const changed = cook(f) !== cook(k); // cambió lo que hay que cocinar
  if (!changed && f.name === k.name && f.mode === k.mode && f.num === k.num) return;
  queue("update", "kitchen/" + sale.id, {...f, updatedAt: Date.now(), modified: changed ? true : !!k.modified,
    ...(changed && k.status === "listo" ? {status: "cocinando", readyAt: null} : {})}, `Pedido #${k.num} actualizado en cocina`);
  if (changed && k.status === "listo") toast(`El pedido #${k.num} volvió a cocina porque cambiaron los productos`, "warn");
}
function markReady(id) {

function unmarkReady(id) {

function kitchenBadge(s) {

function kitchenButtons(s) {
